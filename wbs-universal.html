<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVERA 諾維拉工程顧問 WBS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-navy': '#191918',
                        'secondary-navy': '#333330',
                        'accent-gold': '#191918',
                        'accent-gold-light': '#5A5955',
                        'tech-blue': '#4A6B82'
                    }
                }
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-populate@1.21.0/browser/xlsx-populate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>

    <style>
        body {
            background-color: #F4F3EF;
            color: #191918;
            font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            margin: 0;
            padding: 0;
        }

        .progress-app-container {
            max-width: 1420px;
            margin: 0 auto;
            padding: 12px 24px 96px;
        }

        .input-eng {
            background-color: #FFFFFF;
            border: 1px solid #D5D3CB;
            color: #191918;
            border-radius: 0px;
            font-size: 0.85rem;
            transition: border-color 0.15s ease;
        }

        .input-eng:focus {
            outline: none;
            border-color: #191918;
        }

        .nordic-inline-input {
            background: transparent;
            border: 1px solid transparent;
            padding: 2px 4px;
            transition: border-color 0.12s ease, background-color 0.12s ease;
        }

        .nordic-inline-input:hover {
            background: #FFFFFF;
            border-color: #D5D3CB;
        }

        .nordic-inline-input:focus {
            outline: none;
            background: #FFFFFF;
            border-color: #191918;
        }

        .btn-eng-navy {
            background-color: #191918;
            color: #FFFFFF;
            border: 1px solid #191918;
            border-radius: 0px;
            font-weight: 500;
            transition: background-color 0.15s ease;
            cursor: pointer;
        }

        .btn-eng-navy:hover {
            background-color: #333330;
        }

        .btn-eng-gold {
            background-color: #FFFFFF;
            color: #191918;
            border: 1px solid #191918;
            border-radius: 0px;
            font-weight: 500;
            transition: all 0.15s ease;
            cursor: pointer;
        }

        .btn-eng-gold:hover {
            background-color: #191918;
            color: #FFFFFF;
        }

        /* 北歐建築紙感主階段橫列 (取代深藍高彩度色塊) */
        .task-table tbody tr.main-wbs-row,
        .task-table tbody tr.main-wbs-row td {
            background-color: #EAE8E0 !important;
        }

        .chart-box {
            background-color: #FFFFFF;
            border: 1px solid #DEDCD3;
            padding: 1.25rem;
            position: relative;
        }

        .chart-download-btn {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            z-index: 10;
            background-color: #FFFFFF;
            border: 1px solid #D5D3CB;
            color: #191918;
            padding: 0.3rem 0.65rem;
            font-size: 0.75rem;
            font-weight: 500;
            transition: all 0.15s ease;
        }

        .chart-download-btn:hover {
            background-color: #191918;
            color: #FFFFFF;
            border-color: #191918;
        }

        .tab-button {
            transition: all 0.15s ease;
            border-bottom: 2px solid transparent;
            font-weight: 500;
            color: #73726E;
        }

        .tab-button.active {
            color: #191918;
            border-bottom-color: #191918;
        }

        .modal-base {
            transition: opacity 0.2s ease-in-out;
        }

        .modal-base.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .modal-content {
            background-color: #FFFFFF;
            border: 1px solid #191918;
            box-shadow: 0 20px 50px rgba(25, 25, 24, 0.14);
            max-height: 92vh;
            overflow-y: auto;
        }
    </style>
</head>

<body>
    <!-- 極簡北歐建築工作室風格頂部列 -->
    <header class="bg-[#F4F3EF] border-b border-[#DEDCD3] sticky top-0 z-40">
        <div class="max-w-[1420px] mx-auto px-6 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-baseline gap-4">
                <a href="index.html" class="text-xs text-[#73726E] hover:text-[#191918] no-underline transition" title="返回 NOVERA 諾維拉工程顧問首頁">← 首頁</a>
                <h1 class="text-base font-semibold tracking-tight text-[#191918] m-0">NOVERA 諾維拉工程顧問 WBS</h1>
                <span class="text-xs text-[#73726E]">要徑排程 · 浮時分析 · 雙包絡 S-Curve</span>
                <a href="progress.html" class="text-xs text-[#73726E] hover:text-[#191918] underline underline-offset-4 transition ml-1">切換至營造工程版</a>
            </div>

            <div class="flex items-center gap-2.5 flex-wrap">
                <select id="templateSelector" onchange="applyIndustryTemplate(this.value)" class="input-eng px-3 py-1.5 text-xs text-[#191918] bg-white cursor-pointer">
                    <option value="">載入產業範本...</option>
                    <option value="software">範本 01 — 軟體與行動端開發</option>
                    <option value="marketing">範本 02 — 品牌行銷與新品發表</option>
                    <option value="hardware">範本 03 — 硬體研發與量產導入 (NPI)</option>
                    <option value="interior">範本 04 — 室內設計與商業空間裝修</option>
                    <option value="construction">範本 05 — 營建與工程管理</option>
                    <option value="blank">範本 06 — 空白專案結構</option>
                </select>

                <input type="file" id="jsonFileInput" accept=".json" class="hidden" onchange="importJSON()">
                <button type="button" onclick="document.getElementById('jsonFileInput').click()"
                    class="px-3 py-1.5 text-xs font-medium bg-white hover:bg-[#EAE8E0] text-[#191918] border border-[#D5D3CB] transition">
                    匯入 JSON
                </button>
                <button type="button" onclick="exportJSON()"
                    class="px-3 py-1.5 text-xs font-medium bg-white hover:bg-[#EAE8E0] text-[#191918] border border-[#D5D3CB] transition">
                    備份 JSON
                </button>
                <button type="button" id="show-creation-form-btn" onclick="toggleCreationForm()"
                    class="px-4 py-1.5 text-xs font-medium bg-[#191918] hover:bg-[#333330] text-white transition">
                    + 新增專案
                </button>
            </div>
        </div>
    </header>

    <main class="progress-app-container">
        <div class="flex justify-end mb-2.5">
            <span class="text-xs tracking-wide text-[#73726E]">工具可手動 · 可以請 ANTIGRAVITY 操作</span>
        </div>
        <div id="management-center" class="hidden"></div>

        <!-- 新增專案折疊表單 -->
        <div id="project-creation-form" class="hidden mb-10 p-6 bg-white border border-[#191918]">
            <div class="flex justify-between items-center mb-5 pb-3 border-b border-[#E8E6DF]">
                <h3 class="text-sm font-semibold uppercase tracking-wider text-[#191918]">建立新專案</h3>
                <button type="button" onclick="toggleCreationForm()" class="text-xs text-[#73726E] hover:text-[#191918]">關閉</button>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-6 gap-5 items-stretch">
                <div class="lg:col-span-2 space-y-3">
                    <div>
                        <label class="block text-xs text-[#73726E] mb-1">專案名稱 *</label>
                        <input type="text" id="newProjectName" placeholder="輸入專案名稱" class="w-full p-2 input-eng">
                    </div>
                    <div>
                        <label class="block text-xs text-[#73726E] mb-1">總預算或總權重基數 *</label>
                        <input type="number" id="newContractSum" min="1" placeholder="例: 5000000 或 100" class="w-full p-2 input-eng font-mono">
                    </div>
                </div>
                <div class="lg:col-span-2 grid grid-cols-2 gap-3">
                    <div><label class="block text-xs text-[#73726E] mb-1">委託 / 發起單位 *</label><input type="text" id="newClient" class="w-full p-2 input-eng"></div>
                    <div><label class="block text-xs text-[#73726E] mb-1">規劃單位</label><input type="text" id="newDesigner" class="w-full p-2 input-eng"></div>
                    <div><label class="block text-xs text-[#73726E] mb-1">專案負責人</label><input type="text" id="newSupervisor" class="w-full p-2 input-eng"></div>
                    <div><label class="block text-xs text-[#73726E] mb-1">執行團隊</label><input type="text" id="newConstructionUnit" class="w-full p-2 input-eng"></div>
                </div>
                <div class="lg:col-span-2 space-y-3">
                    <div>
                        <label class="block text-xs text-[#73726E] mb-1">啟動日期 *</label>
                        <input type="date" id="newStartDate" onchange="updateProjectDates('start', 'new')" class="w-full p-2 input-eng font-mono">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block text-xs text-[#73726E] mb-1">預計天數 *</label><input type="number" id="newContractDuration" oninput="updateProjectDates('duration', 'new')" class="w-full p-2 input-eng font-mono"></div>
                        <div><label class="block text-xs text-[#73726E] mb-1">預計結案日 *</label><input type="date" id="newPlannedCompletionDate" onchange="updateProjectDates('completionDate', 'new')" class="w-full p-2 input-eng font-mono"></div>
                    </div>
                </div>
            </div>
            <div class="mt-6 flex justify-end items-center gap-3">
                <button type="button" onclick="toggleCreationForm()" class="px-5 py-2 border border-[#D5D3CB] text-[#73726E] hover:text-[#191918] text-xs font-medium">取消</button>
                <button type="button" onclick="createProject()" class="px-6 py-2 bg-[#191918] text-white text-xs font-medium">確認建立專案</button>
            </div>
        </div>

        <div id="message-box" class="fixed top-16 right-6 z-[99999] w-full max-w-xs"></div>

        <!-- 專案清單主容器 -->
        <div id="project-list-container"></div>
    </main>

    <!-- 圖表分析儀表板 Modal -->
    <div id="chart-modal"
        class="modal-base fixed inset-0 hidden items-center justify-center p-2 md:p-6 bg-black/40 z-50"
        onclick="if(event.target.id === 'chart-modal') hideChartModal()">
        <div class="modal-content w-full max-w-[96vw] p-6 relative z-50 flex flex-col">
            <button onclick="hideChartModal()"
                class="absolute top-4 right-5 text-[#73726E] hover:text-[#191918] text-2xl font-light">&times;</button>
            <div class="text-xs uppercase tracking-widest text-[#73726E]">Schedule & Earned Value Analytics</div>
            <h3 class="text-lg font-semibold text-[#191918] mt-0.5 pr-8">
                <span id="modal-project-title"></span>
            </h3>
            <div class="border-b border-[#DEDCD3] mt-3 mb-5 flex flex-wrap justify-between items-center gap-2">
                <nav class="-mb-px flex space-x-6 flex-wrap">
                    <button id="tab-btn-comparison" data-tab="comparison" onclick="switchChartTab(this)"
                        class="tab-button py-2.5 text-xs active">01 / 雙包絡香蕉 S-Curve ＆ EVM 分析</button>
                    <button id="tab-btn-planned" data-tab="planned" onclick="switchChartTab(this)"
                        class="tab-button py-2.5 text-xs">02 / 預定排程 S 曲線 ＆ 要徑甘特圖</button>
                    <button id="tab-btn-actual" data-tab="actual" onclick="switchChartTab(this)"
                        class="tab-button py-2.5 text-xs">03 / 實際累積進度 S 曲線</button>
                    <button id="tab-btn-network" data-tab="network" onclick="switchChartTab(this)"
                        class="tab-button py-2.5 text-xs">04 / PDM 要徑邏輯網狀圖 (AON)</button>
                </nav>
                <div class="flex items-center gap-2 pb-1.5 flex-wrap">
                    <button type="button" id="wideChartToggleBtn" onclick="toggleWideChartView()"
                        class="px-3 py-1 text-xs border border-[#D5D3CB] bg-white text-[#191918] hover:bg-[#191918] hover:text-white transition">
                        切換寬幅檢視
                    </button>
                    <select id="chartTimeScaleSelect" onchange="onChartTimeScaleChange(this.value)"
                        class="p-1 input-eng text-xs">
                        <option value="auto">自動刻度</option>
                        <option value="week">每週刻度</option>
                        <option value="day">逐日刻度</option>
                    </select>
                </div>
            </div>

            <div id="tab-content-comparison" class="flex-grow min-h-0 overflow-y-auto">
                <div id="evm-metrics-dashboard" class="mb-4"></div>
                <div class="grid grid-cols-1 gap-6">
                    <div class="chart-box flex flex-col overflow-x-auto">
                        <button data-action="download-single-chart" data-canvas-id="comparisonSCurveCanvas"
                            class="chart-download-btn">下載 PNG</button>
                        <div class="chart-wide-inner relative flex-grow min-h-[480px]"><canvas id="comparisonSCurveCanvas"></canvas></div>
                    </div>
                </div>
                <div class="mt-4 flex justify-end gap-3">
                    <button data-tab="comparison" onclick="exportProjectToExcel(this)" class="btn-eng-navy py-2 px-5 text-xs">匯出 Excel 完整報表 (.xlsx)</button>
                    <button data-tab="comparison" onclick="downloadChartsAsPNG(this)" class="btn-eng-gold py-2 px-5 text-xs">下載本頁圖表 (.png)</button>
                </div>
            </div>

            <div id="tab-content-planned" class="hidden flex-grow min-h-0 overflow-y-auto">
                <div class="flex flex-col gap-6">
                    <div class="chart-box flex flex-col overflow-x-auto">
                        <button data-action="download-single-chart" data-canvas-id="plannedCombinedCanvas" class="chart-download-btn">下載 PNG</button>
                        <div class="chart-wide-inner relative flex-grow min-h-[440px]"><canvas id="plannedCombinedCanvas"></canvas></div>
                    </div>
                    <div class="chart-box flex flex-col overflow-x-auto">
                        <button data-action="download-single-chart" data-canvas-id="plannedSCurveCanvas" class="chart-download-btn">下載 PNG</button>
                        <div class="chart-wide-inner relative flex-grow min-h-[440px]"><canvas id="plannedSCurveCanvas"></canvas></div>
                    </div>
                    <div class="chart-box flex flex-col overflow-x-auto">
                        <button data-action="download-single-chart" data-canvas-id="plannedGanttCanvas" class="chart-download-btn">下載 PNG</button>
                        <div class="chart-wide-inner relative flex-grow min-h-[520px]"><canvas id="plannedGanttCanvas"></canvas></div>
                    </div>
                </div>
                <div class="mt-4 flex justify-end gap-3">
                    <button data-tab="planned" onclick="exportProjectToExcel(this)" class="btn-eng-navy py-2 px-5 text-xs">匯出 Excel 完整報表 (.xlsx)</button>
                    <button data-tab="planned" onclick="downloadChartsAsPNG(this)" class="btn-eng-gold py-2 px-5 text-xs">下載本頁圖表 (.png)</button>
                </div>
            </div>

            <div id="tab-content-actual" class="hidden flex-grow min-h-0 overflow-y-auto">
                <div class="grid grid-cols-1 gap-6">
                    <div class="chart-box flex flex-col overflow-x-auto">
                        <button data-action="download-single-chart" data-canvas-id="actualSCurveCanvas" class="chart-download-btn">下載 PNG</button>
                        <div class="chart-wide-inner relative flex-grow min-h-[450px]"><canvas id="actualSCurveCanvas"></canvas></div>
                    </div>
                </div>
                <div class="mt-4 flex justify-end gap-3">
                    <button data-tab="actual" onclick="exportProjectToExcel(this)" class="btn-eng-navy py-2 px-5 text-xs">匯出 Excel 完整報表 (.xlsx)</button>
                    <button data-tab="actual" onclick="downloadChartsAsPNG(this)" class="btn-eng-gold py-2 px-5 text-xs">下載本頁圖表 (.png)</button>
                </div>
            </div>

            <div id="tab-content-network" class="hidden flex-grow min-h-0 overflow-y-auto">
                <div class="grid grid-cols-1 gap-6">
                    <div class="chart-box flex flex-col overflow-x-auto">
                        <button data-action="download-single-chart" data-canvas-id="pdmNetworkCanvas" class="chart-download-btn">下載 PNG</button>
                        <div class="chart-wide-inner relative flex-grow min-h-[560px]"><canvas id="pdmNetworkCanvas"></canvas></div>
                    </div>
                </div>
                <div class="mt-4 flex justify-end gap-3">
                    <button data-tab="network" onclick="exportProjectToExcel(this)" class="btn-eng-navy py-2 px-5 text-xs">匯出 Excel 完整報表 (.xlsx)</button>
                    <button data-action="download-single-chart" data-canvas-id="pdmNetworkCanvas" class="btn-eng-gold py-2 px-5 text-xs">下載 PDM 網狀圖 (.png)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 編輯專案 Modal -->
    <div id="edit-project-modal"
        class="modal-base fixed inset-0 hidden items-center justify-center p-4 bg-black/40 z-50"
        onclick="if(event.target.id === 'edit-project-modal') hideEditModal()">
        <div class="modal-content w-full max-w-3xl p-6 md:p-8 relative z-50">
            <button onclick="hideEditModal()" class="absolute top-4 right-5 text-[#73726E] hover:text-[#191918] text-2xl font-light">&times;</button>
            <h3 class="text-sm font-semibold uppercase tracking-wider mb-5 text-[#191918] border-b border-[#E8E6DF] pb-3">修改專案資訊</h3>
            <input type="hidden" id="editProjectId">
            <div class="grid grid-cols-1 lg:grid-cols-6 gap-5">
                <div class="lg:col-span-2 space-y-3">
                    <div>
                        <label class="block text-xs text-[#73726E] mb-1">專案名稱 *</label>
                        <input type="text" id="editProjectName" class="w-full p-2 input-eng">
                    </div>
                    <div>
                        <label class="block text-xs text-[#73726E] mb-1">總預算 / 總權重基數 *</label>
                        <input type="number" id="editContractSum" min="1" class="w-full p-2 input-eng font-mono">
                    </div>
                </div>
                <div class="lg:col-span-2 grid grid-cols-2 gap-3">
                    <div><label class="block text-xs text-[#73726E] mb-1">發起 / 客戶</label><input type="text" id="editClient" class="w-full p-2 input-eng"></div>
                    <div><label class="block text-xs text-[#73726E] mb-1">規劃單位</label><input type="text" id="editDesigner" class="w-full p-2 input-eng"></div>
                    <div><label class="block text-xs text-[#73726E] mb-1">專案負責人</label><input type="text" id="editSupervisor" class="w-full p-2 input-eng"></div>
                    <div><label class="block text-xs text-[#73726E] mb-1">執行團隊</label><input type="text" id="editConstructionUnit" class="w-full p-2 input-eng"></div>
                </div>
                <div class="lg:col-span-2 space-y-3">
                    <div>
                        <label class="block text-xs text-[#73726E] mb-1">啟動日 *</label>
                        <input type="date" id="editStartDate" onchange="updateProjectDates('start', 'edit')" class="w-full p-2 input-eng font-mono">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block text-xs text-[#73726E] mb-1">預計天數</label><input type="number" id="editContractDuration" oninput="updateProjectDates('duration', 'edit')" class="w-full p-2 input-eng font-mono"></div>
                        <div><label class="block text-xs text-[#73726E] mb-1">預計結案日</label><input type="date" id="editPlannedCompletionDate" onchange="updateProjectDates('completionDate', 'edit')" class="w-full p-2 input-eng font-mono"></div>
                    </div>
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-3">
                <button onclick="hideEditModal()" class="px-5 py-2 border border-[#D5D3CB] text-[#73726E] text-xs">取消</button>
                <button onclick="updateProject()" class="btn-eng-navy px-6 py-2 text-xs">儲存變更</button>
            </div>
        </div>
    </div>

    <!-- 編輯子任務 Modal -->
    <div id="edit-task-modal"
        class="modal-base fixed inset-0 hidden items-center justify-center p-4 bg-black/40 z-50"
        onclick="if(event.target.id === 'edit-task-modal') hideEditTaskModal()">
        <div class="modal-content w-full max-w-lg p-6 md:p-7 relative z-50">
            <button onclick="hideEditTaskModal()" class="absolute top-4 right-5 text-[#73726E] hover:text-[#191918] text-2xl font-light">&times;</button>
            <h3 class="text-sm font-semibold uppercase tracking-wider mb-4 text-[#191918] border-b border-[#E8E6DF] pb-2.5">編輯任務與前置依賴關係</h3>
            <input type="hidden" id="editTaskProjectId">
            <input type="hidden" id="editTaskId">
            <div class="space-y-3">
                <div class="grid grid-cols-3 gap-3 p-3 bg-[#FAF9F6] border border-[#E5E3DC]">
                    <div>
                        <label class="block text-xs text-[#73726E] mb-1">階段代碼</label>
                        <input type="text" id="editTaskCatCode" class="w-full p-2 input-eng font-mono text-xs">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-xs text-[#73726E] mb-1">主階段名稱</label>
                        <input type="text" id="editTaskCatName" class="w-full p-2 input-eng text-xs">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs text-[#73726E] mb-1">WBS 編碼</label>
                        <input type="text" id="editTaskWbs" class="w-full p-2 input-eng font-mono text-xs">
                    </div>

    <!-- 核心運算與圖表腳本 (100% 保留核心演算法) -->
    <script>
        let projects = [];
        let isCreationFormVisible = false;
        const MS_PER_DAY = 1000 * 60 * 60 * 24;

        const formatDate = (date) => {
            if (!date) return '';
            if (typeof date === 'string' || typeof date === 'number') date = new Date(date);
            if (isNaN(date.getTime())) return '';
            const year = date.getFullYear();
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const formatCurrency = (number) => number ? Math.round(number).toLocaleString('zh-TW') : '0';
        const escHtml = (str) => String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        const generateId = () => Date.now().toString(36) + Math.random().toString(36).substr(2);

        function updateProjectDates(source, prefix = 'new') {
            const startDateInput = document.getElementById(`${prefix}StartDate`);
            const durationInput = document.getElementById(`${prefix}ContractDuration`);
            const completionDateInput = document.getElementById(`${prefix}PlannedCompletionDate`);

            if (!startDateInput.value) return;
            const startDate = new Date(startDateInput.value);

            if (source === 'duration' && durationInput.value) {
                const duration = parseInt(durationInput.value);
                if (duration > 0) {
                    const completionDate = new Date(startDate.getTime());
                    completionDate.setDate(completionDate.getDate() + duration - 1);
                    completionDateInput.value = formatDate(completionDate);
                }
            } else if (source === 'completionDate' && completionDateInput.value) {
                const completionDate = new Date(completionDateInput.value);
                if (completionDate >= startDate) {
                    const diffTime = completionDate.getTime() - startDate.getTime();
                    const duration = Math.ceil(diffTime / MS_PER_DAY) + 1;
                    durationInput.value = duration;
                }
            }
        }

        function getDurationDays(startStr, endStr) {
            if (!startStr || !endStr) return 0;
            const start = new Date(startStr);
            const end = new Date(endStr);
            if (isNaN(start.getTime()) || isNaN(end.getTime()) || end < start) return 0;
            return Math.floor((end - start) / MS_PER_DAY) + 1;
        }

        function toggleCreationForm() {
            isCreationFormVisible = !isCreationFormVisible;
            document.getElementById('project-creation-form').classList.toggle('hidden', !isCreationFormVisible);
            document.getElementById('management-center').classList.toggle('hidden', isCreationFormVisible);
        }

        function createProject() {
            const newProject = {
                id: generateId(),
                name: document.getElementById('newProjectName').value.trim(),
                contractSum: parseFloat(document.getElementById('newContractSum').value),
                client: document.getElementById('newClient').value.trim(),
                designer: document.getElementById('newDesigner').value.trim(),
                supervisor: document.getElementById('newSupervisor').value.trim(),
                constructionUnit: document.getElementById('newConstructionUnit').value.trim(),
                startDate: document.getElementById('newStartDate').value,
                contractDuration: parseInt(document.getElementById('newContractDuration').value),
                originalContractDuration: parseInt(document.getElementById('newContractDuration').value),
                plannedCompletionDate: document.getElementById('newPlannedCompletionDate').value,
                originalPlannedCompletionDate: document.getElementById('newPlannedCompletionDate').value,
                isCollapsed: false,
                tasks: []
            };

            if (!newProject.name || !newProject.client || !newProject.startDate || !newProject.plannedCompletionDate || isNaN(newProject.contractSum)) {
                showMessage('錯誤：請填寫所有必填欄位 (案名、甲方、開工日期、預定完工日、契約總額)。', 'danger');
                return;
            }

            projects.push(newProject);
            ['newProjectName', 'newContractSum', 'newClient', 'newDesigner', 'newSupervisor', 'newConstructionUnit', 'newStartDate', 'newContractDuration', 'newPlannedCompletionDate'].forEach(id => document.getElementById(id).value = '');

            saveToLocalStorage();
            renderProjects();
            showMessage(`工程案件「${newProject.name}」已成功建立。`, 'success');
            toggleCreationForm();
        }

        function deleteProject(projectId) {
            const project = projects.find(p => p.id === projectId);
            if (!project) return;
            showConfirmModal(`您確定要永久刪除工程案件「${project.name}」嗎？所有相關工項與進度紀錄將無法復原。`, () => {
                projects = projects.filter(p => p.id !== projectId);
                saveToLocalStorage();
                renderProjects();
                showMessage('工程案件已刪除。', 'warning');
            });
        }

        function showEditModal(projectId) {
            const project = projects.find(p => p.id === projectId);
            if (!project) return;

            document.getElementById('editProjectId').value = project.id;
            document.getElementById('editProjectName').value = project.name;
            document.getElementById('editContractSum').value = project.contractSum;
            document.getElementById('editClient').value = project.client;
            document.getElementById('editDesigner').value = project.designer;
            document.getElementById('editSupervisor').value = project.supervisor;
            document.getElementById('editConstructionUnit').value = project.constructionUnit;
            document.getElementById('editStartDate').value = project.startDate;
            document.getElementById('editContractDuration').value = project.originalContractDuration || project.contractDuration;
            document.getElementById('editPlannedCompletionDate').value = project.originalPlannedCompletionDate || project.plannedCompletionDate;

            document.getElementById('edit-project-modal').classList.remove('hidden');
        }

        function hideEditModal() {
            document.getElementById('edit-project-modal').classList.add('hidden');
        }

        function updateProject() {
            const projectId = document.getElementById('editProjectId').value;
            const projectIndex = projects.findIndex(p => p.id === projectId);
            if (projectIndex === -1) return;

            projects[projectIndex] = {
                ...projects[projectIndex],
                name: document.getElementById('editProjectName').value.trim(),
                contractSum: parseFloat(document.getElementById('editContractSum').value),
                client: document.getElementById('editClient').value.trim(),
                designer: document.getElementById('editDesigner').value.trim(),
                supervisor: document.getElementById('editSupervisor').value.trim(),
                constructionUnit: document.getElementById('editConstructionUnit').value.trim(),
                startDate: document.getElementById('editStartDate').value,
                contractDuration: parseInt(document.getElementById('editContractDuration').value),
                originalContractDuration: parseInt(document.getElementById('editContractDuration').value),
                plannedCompletionDate: document.getElementById('editPlannedCompletionDate').value,
                originalPlannedCompletionDate: document.getElementById('editPlannedCompletionDate').value
            };

            saveToLocalStorage();
            renderProjects();
            hideEditModal();
            showMessage(`工程案件「${projects[projectIndex].name}」資訊已更新。`, 'success');
        }

        function toggleCollapse(projectId) {
            const project = projects.find(p => p.id === projectId);
            if (project) {
                project.isCollapsed = !project.isCollapsed;
                renderProjects();
            }
        }

        function getTaskProgressAsOf(task, asOfDateStr) {
            if (!task || !task.progressHistory || task.progressHistory.length === 0 || !asOfDateStr) {
                return 0;
            }
            const sortedHistory = [...task.progressHistory].sort((a, b) => new Date(a.date) - new Date(b.date));
            const asOfDate = new Date(asOfDateStr);
            let prevUpdate = null;
            let nextUpdate = null;
            for (const update of sortedHistory) {
                const updateDate = new Date(update.date);
                if (updateDate <= asOfDate) {
                    prevUpdate = update;
                } else {
                    nextUpdate = update;
                    break;
                }
            }
            if (!prevUpdate) return 0;
            if (!nextUpdate || new Date(prevUpdate.date).getTime() === asOfDate.getTime()) return prevUpdate.progress;

            const prevDate = new Date(prevUpdate.date);
            const nextDate = new Date(nextUpdate.date);
            const totalDuration = (nextDate - prevDate) / MS_PER_DAY;
            const elapsedDuration = (asOfDate - prevDate) / MS_PER_DAY;
            if (totalDuration <= 0) return prevUpdate.progress;
            const progressDiff = nextUpdate.progress - prevUpdate.progress;
            const interpolatedProgress = prevUpdate.progress + (progressDiff * (elapsedDuration / totalDuration));
            return Math.max(0, Math.min(100, interpolatedProgress));
        }

        function getTaskPlannedProgress(task, asOfDateStr) {
            if (!task || !task.plannedStartDate || !task.plannedEndDate || !asOfDateStr) return 0;
            const today = new Date(asOfDateStr);
            const start = new Date(task.plannedStartDate);
            const end = new Date(task.plannedEndDate);
            if (isNaN(start.getTime()) || isNaN(end.getTime())) return 0;
            if (today < start) return 0;
            if (today >= end) return 100;
            const totalDuration = getDurationDays(task.plannedStartDate, task.plannedEndDate);
            const elapsedDuration = getDurationDays(task.plannedStartDate, asOfDateStr);
            return totalDuration > 0 ? Math.min(100, (elapsedDuration / totalDuration) * 100) : 0;
        }

        /**
 * 計算指定日期之專案早期排程累積進度 (Early S-Curve, ES Upper Bound)
 */
        function getProjectEarlyProgressAtDate(project, dateStr) {
            if (!project || !project.tasks || project.tasks.length === 0 || !dateStr) return 0;
            const targetDate = new Date(dateStr);
            const totalCost = project.tasks.reduce((sum, t) => sum + (parseFloat(t.taskCost) || 0), 0);
            if (totalCost <= 0) return 0;

            let totalWeighted = 0;
            project.tasks.forEach(t => {
                const cost = parseFloat(t.taskCost) || 0;
                const weight = cost / totalCost;
                const start = new Date(t.plannedStartDate);
                const end = new Date(t.plannedEndDate);
                let progress = 0;
                if (targetDate < start) {
                    progress = 0;
                } else if (targetDate >= end) {
                    progress = 100;
                } else {
                    const dur = Math.max(1, Math.round((end - start) / (1000 * 60 * 60 * 24)) + 1);
                    const elapsed = Math.max(0, Math.round((targetDate - start) / (1000 * 60 * 60 * 24)) + 1);
                    progress = Math.min(100, (elapsed / dur) * 100);
                }
                totalWeighted += (progress / 100) * weight;
            });
            return totalWeighted * 100;
        }

        /**
         * 計算指定日期之專案晚期排程累積進度 (Late S-Curve, LS Lower Bound - 臨界要徑警戒線)
         */
        function getProjectLateProgressAtDate(project, dateStr) {
            if (!project || !project.tasks || project.tasks.length === 0 || !dateStr) return 0;
            const targetDate = new Date(dateStr);
            const totalCost = project.tasks.reduce((sum, t) => sum + (parseFloat(t.taskCost) || 0), 0);
            if (totalCost <= 0) return 0;

            let totalWeighted = 0;
            project.tasks.forEach(t => {
                const cost = parseFloat(t.taskCost) || 0;
                const weight = cost / totalCost;
                const start = new Date(t.lateStartDate || t.plannedStartDate);
                const end = new Date(t.lateEndDate || t.plannedEndDate);
                let progress = 0;
                if (targetDate < start) {
                    progress = 0;
                } else if (targetDate >= end) {
                    progress = 100;
                } else {
                    const dur = Math.max(1, Math.round((end - start) / (1000 * 60 * 60 * 24)) + 1);
                    const elapsed = Math.max(0, Math.round((targetDate - start) / (1000 * 60 * 60 * 24)) + 1);
                    progress = Math.min(100, (elapsed / dur) * 100);
                }
                totalWeighted += (progress / 100) * weight;
            });
            return totalWeighted * 100;
        }

        function getOverallPlannedProgressByTasks(project, asOfDateStr) {
            return getProjectEarlyProgressAtDate(project, asOfDateStr);
        }


        function getStatus(actualProgress, plannedProgress) {
            const diff = actualProgress - plannedProgress;
            if (actualProgress >= 99.9) return { text: "已完工", color: "text-emerald-700 bg-emerald-100 border-emerald-500", diff };
            if (diff >= 5) return { text: `大幅超前`, color: "text-blue-700 bg-blue-100 border-blue-500", diff };
            if (diff >= -5) return { text: "進度正常", color: "text-amber-700 bg-amber-100 border-amber-500", diff };
            return { text: `進度落後`, color: "text-red-700 bg-red-100 border-red-500", diff };
        }

        /**
 * 行政院工程會標準 CPM 要徑網圖演算引擎
 * 包含: DAG 拓撲排序、順推 (Forward Pass)、逆推 (Backward Pass)、總浮時與自由浮時、要徑標定
 */
        function calculateProjectCPM(project) {
            if (!project || !project.tasks || project.tasks.length === 0) return;
            const tasks = project.tasks;
            const taskMap = {};
            tasks.forEach((t, idx) => {
                if (!t.wbsCode) t.wbsCode = `1.${idx + 1}`;
                if (!t.predecessors) t.predecessors = [];
                t.duration = parseInt(t.duration) || 1;
                taskMap[t.id] = t;
            });

            const MS_PER_DAY = 1000 * 60 * 60 * 24;
            const baseDate = new Date(project.startDate);

            // 1. 順推 (Forward Pass) 計算 ES (最早開始) 與 EF (最早完成)
            const resolved = new Set();
            let iterations = 0;
            const maxIterations = tasks.length * 4;

            while (resolved.size < tasks.length && iterations < maxIterations) {
                iterations++;
                let progressMade = false;
                for (const t of tasks) {
                    if (resolved.has(t.id)) continue;
                    const predsReady = t.predecessors.every(p => resolved.has(p.taskId));
                    if (predsReady) {
                        if (t.predecessors.length === 0) {
                            t.es = 0;
                        } else {
                            let maxES = 0;
                            t.predecessors.forEach(p => {
                                const pred = taskMap[p.taskId];
                                if (pred) {
                                    const lag = parseInt(p.lag) || 0;
                                    let candidateES = 0;
                                    if (p.type === 'SS') {
                                        candidateES = pred.es + lag;
                                    } else if (p.type === 'FF') {
                                        candidateES = pred.ef + lag - t.duration;
                                    } else { // 預設 FS (Finish-to-Start)
                                        candidateES = pred.ef + lag;
                                    }
                                    if (candidateES > maxES) maxES = candidateES;
                                }
                            });
                            t.es = Math.max(0, maxES);
                        }
                        t.ef = t.es + t.duration;
                        resolved.add(t.id);
                        progressMade = true;
                    }
                }
                if (!progressMade && resolved.size < tasks.length) {
                    tasks.forEach(t => {
                        if (!resolved.has(t.id)) {
                            t.es = t.es || 0;
                            t.ef = t.es + t.duration;
                            resolved.add(t.id);
                        }
                    });
                    break;
                }
            }

            // 專案最早總工期天數
            const projectDurationDays = Math.max(...tasks.map(t => t.ef), 1);

            // 2. 建立緊後作業對照表 (Successors Map)
            const succMap = {};
            tasks.forEach(t => succMap[t.id] = []);
            tasks.forEach(t => {
                t.predecessors.forEach(p => {
                    if (succMap[p.taskId]) {
                        succMap[p.taskId].push({ succId: t.id, type: p.type || 'FS', lag: parseInt(p.lag) || 0 });
                    }
                });
            });

            // 3. 逆推 (Backward Pass) 計算 LS (最晚開始) 與 LF (最晚完成)
            const revResolved = new Set();
            iterations = 0;
            while (revResolved.size < tasks.length && iterations < maxIterations) {
                iterations++;
                let progressMade = false;
                for (const t of tasks) {
                    if (revResolved.has(t.id)) continue;
                    const succs = succMap[t.id] || [];
                    const succsReady = succs.every(s => revResolved.has(s.succId));
                    if (succsReady) {
                        if (succs.length === 0) {
                            t.lf = projectDurationDays;
                        } else {
                            let minLF = Infinity;
                            succs.forEach(s => {
                                const succ = taskMap[s.succId];
                                if (succ) {
                                    let candidateLF = Infinity;
                                    if (s.type === 'SS') {
                                        candidateLF = succ.ls - s.lag + t.duration;
                                    } else if (s.type === 'FF') {
                                        candidateLF = succ.lf - s.lag;
                                    } else { // 預設 FS
                                        candidateLF = succ.ls - s.lag;
                                    }
                                    if (candidateLF < minLF) minLF = candidateLF;
                                }
                            });
                            t.lf = minLF === Infinity ? projectDurationDays : minLF;
                        }
                        t.ls = Math.max(0, t.lf - t.duration);
                        t.lf = t.ls + t.duration;
                        t.totalFloat = Math.max(0, t.ls - t.es);
                        t.isCritical = (t.totalFloat <= 0.001);
                        revResolved.add(t.id);
                        progressMade = true;
                    }
                }
                if (!progressMade && revResolved.size < tasks.length) {
                    tasks.forEach(t => {
                        if (!revResolved.has(t.id)) {
                            t.lf = t.ef;
                            t.ls = t.es;
                            t.totalFloat = 0;
                            t.isCritical = true;
                            revResolved.add(t.id);
                        }
                    });
                    break;
                }
            }

            // 4. 自由浮時 (Free Float) 計算 (完整支援 FS / SS / FF 邏輯關係與 Lag)
            tasks.forEach(t => {
                const succs = succMap[t.id] || [];
                if (succs.length === 0) {
                    t.freeFloat = Math.max(0, projectDurationDays - t.ef);
                } else {
                    let minFF = Infinity;
                    succs.forEach(s => {
                        const succ = taskMap[s.succId];
                        if (succ) {
                            let candFF = Infinity;
                            if (s.type === 'SS') {
                                candFF = (succ.es - s.lag) - t.es;
                            } else if (s.type === 'FF') {
                                candFF = (succ.ef - s.lag) - t.ef;
                            } else { // 預設 FS
                                candFF = (succ.es - s.lag) - t.ef;
                            }
                            if (candFF < minFF) minFF = candFF;
                        }
                    });
                    t.freeFloat = minFF === Infinity ? 0 : Math.max(0, minFF);
                }
            });

            // 5. 日期反向對齊 (含甘特圖視覺結束座標 ganttEarlyEnd / ganttLateEnd，解決 Chart.js 午夜 00:00 少畫 1 天問題)
            tasks.forEach(t => {
                const earlyStart = new Date(baseDate.getTime() + t.es * MS_PER_DAY);
                const earlyEnd = new Date(baseDate.getTime() + (t.ef - 1) * MS_PER_DAY);
                const lateStart = new Date(baseDate.getTime() + t.ls * MS_PER_DAY);
                const lateEnd = new Date(baseDate.getTime() + (t.lf - 1) * MS_PER_DAY);
                const ganttEarlyEnd = new Date(baseDate.getTime() + t.ef * MS_PER_DAY);
                const ganttLateEnd = new Date(baseDate.getTime() + t.lf * MS_PER_DAY);

                t.plannedStartDate = formatDate(earlyStart);
                t.plannedEndDate = formatDate(earlyEnd);
                t.lateStartDate = formatDate(lateStart);
                t.lateEndDate = formatDate(lateEnd);
                t.ganttEarlyEnd = formatDate(ganttEarlyEnd);
                t.ganttLateEnd = formatDate(ganttLateEnd);
            });

            // 保留原始契約工期設定，並同步排程推算總工期與預定完工日
            if (!project.originalContractDuration && project.contractDuration) {
                project.originalContractDuration = project.contractDuration;
            }
            if (!project.originalPlannedCompletionDate && project.plannedCompletionDate) {
                project.originalPlannedCompletionDate = project.plannedCompletionDate;
            }
            const projectEndDate = new Date(baseDate.getTime() + (projectDurationDays - 1) * MS_PER_DAY);
            project.plannedCompletionDate = formatDate(projectEndDate);
            project.scheduledDuration = projectDurationDays;
            project.contractDuration = projectDurationDays;
        }

        function calculateProjectSummary(project, asOfDate) {
            const { tasks } = project;
            if (!tasks || tasks.length === 0) {
                return { totalTaskCost: 0, overallProgress: 0, plannedProgress: 0, criticalTasksCount: 0, projectDuration: 0, lastTaskEndDate: project.startDate };
            }

            // 執行 CPM 要徑與浮時運算
            calculateProjectCPM(project);

            let totalWeightedProgress = 0;
            let criticalCount = 0;
            const totalCost = tasks.reduce((sum, task) => sum + (parseFloat(task.taskCost) || 0), 0);

            tasks.forEach(task => {
                const cost = parseFloat(task.taskCost) || 0;
                const weight = totalCost > 0 ? (cost / totalCost) * 100 : 0;
                task.weight = weight;
                const currentProgress = getTaskProgressAsOf(task, asOfDate);
                totalWeightedProgress += (currentProgress / 100) * (weight / 100);
                if (task.isCritical) criticalCount++;
            });

            return {
                totalTaskCost: totalCost,
                overallProgress: totalWeightedProgress * 100,
                plannedProgress: getOverallPlannedProgressByTasks(project, asOfDate),
                criticalTasksCount: criticalCount,
                projectDuration: project.contractDuration,
                lastTaskEndDate: project.plannedCompletionDate
            };
        }

        function deleteTask(projectId, taskId) {
            const project = projects.find(p => p.id === projectId);

            showConfirmModal(`確定要刪除分項工程「${task.taskName}」嗎？此操作無法復原。`, () => {
                project.tasks = project.tasks.filter(t => t.id !== taskId);

                project.tasks.forEach(t => {
                    if (t.predecessors) {
                        t.predecessors = t.predecessors.filter(p => p.taskId !== taskId);
                    }
                });
                calculateProjectCPM(project);
                saveToLocalStorage();
                renderProjects();
                showMessage('分項工程已刪除，並自動重算 CPM 網圖。', 'warning');

        function moveTask(projectId, taskId, direction) {
            const project = projects.find(p => p.id === projectId);
            if (!project || !project.tasks) return;
            const idx = project.tasks.findIndex(t => t.id === taskId);
            if (idx === -1) return;
            const targetIdx = direction === 'up' ? idx - 1 : idx + 1;
            if (targetIdx < 0 || targetIdx >= project.tasks.length) return;
            const temp = project.tasks[idx];
            project.tasks[idx] = project.tasks[targetIdx];
            project.tasks[targetIdx] = temp;
            calculateProjectCPM(project);
            saveToLocalStorage();
            renderProjects();
        }

            const project = projects.find(p => p.id === projectId);

            const idx = project.tasks.findIndex(t => t.id === targetTaskId);
            if (idx === -1) return;
            ensureProjectMainCategories(project);
            const refTask = project.tasks[idx];
            const { catCode, catName } = getTaskMainWbsInfo(refTask, project);

        function updateTask() {
            const projectId = document.getElementById('editTaskProjectId').value;
            const taskId = document.getElementById('editTaskId').value;
            const project = projects.find(p => p.id === projectId);
            if (!project) return;
            const task = project.tasks.find(t => t.id === taskId);
            if (!task) return;

            const taskWbs = document.getElementById('editTaskWbs').value.trim();
            const taskName = document.getElementById('editTaskName').value.trim();
            const taskCost = parseFloat(document.getElementById('editTaskCost').value);
            const duration = parseInt(document.getElementById('editTaskDuration').value);
            const predId = document.getElementById('editTaskPred').value;
            const predType = document.getElementById('editTaskPredType').value || 'FS';
            const predLag = parseInt(document.getElementById('editTaskPredLag').value) || 0;

            if (!taskName || isNaN(taskCost) || isNaN(duration) || duration <= 0) {
                showMessage('錯誤：請完整填寫工項名稱、金額與有效工期。', 'danger');
                return;
            }

            const newPreds = [];
            const seenIds = new Set();
            if (predId && predId !== taskId) {
                newPreds.push({ taskId: predId, type: predType, lag: predLag });
                seenIds.add(predId);
            }
            const extraRows = document.querySelectorAll('#editTaskExtraPredsContainer .extra-pred-row');
            extraRows.forEach(row => {
                const eid = row.querySelector('.extra-pred-id')?.value;
                const etype = row.querySelector('.extra-pred-type')?.value || 'FS';
                const elag = parseInt(row.querySelector('.extra-pred-lag')?.value) || 0;
                if (eid && eid !== taskId && !seenIds.has(eid)) {
                    newPreds.push({ taskId: eid, type: etype, lag: elag });
                    seenIds.add(eid);
                }
            });

            ensureProjectMainCategories(project);
            const editCatCode = document.getElementById('editTaskCatCode') ? document.getElementById('editTaskCatCode').value.trim() : '';
            const editCatName = document.getElementById('editTaskCatName') ? document.getElementById('editTaskCatName').value.trim() : '';

                task.catCode = editCatCode;
                if (editCatName) {
                    task.catName = editCatName;
                    project.mainCategories[editCatCode] = editCatName;
                }

            task.wbsCode = taskWbs || task.wbsCode || '01.1';
            task.taskName = taskName;
            task.taskCost = taskCost;
            task.duration = duration;
            task.predecessors = newPreds;

                        projects = parsed;

                        projects.forEach(p => {
                            if (!p.tasks) p.tasks = [];

                                if (!t.predecessors) {

                        });

            saveToLocalStorage();

            window.scrollTo({ top: 0, behavior: 'smooth' });
            showMessage(`已建立「${newProj.name}」`, 'success');
        }

        function inlineUpdateTask(projectId, taskId, field, rawValue) {
            const project = projects.find(p => p.id === projectId);
            if (!project) return;
            const task = project.tasks.find(t => t.id === taskId);
            if (!task) return;

            if (field === 'taskName') {
                const v = String(rawValue || '').trim();
                if (!v) { renderProjects(); return; }
                task.taskName = v;
            } else if (field === 'wbsCode') {
                const v = String(rawValue || '').trim();
                if (!v) { renderProjects(); return; }
                task.wbsCode = v;
            } else if (field === 'taskCost') {
                const v = parseFloat(rawValue);
                if (isNaN(v) || v < 0) { renderProjects(); return; }
                task.taskCost = v;
            } else if (field === 'duration') {
                const v = parseInt(rawValue, 10);
                if (isNaN(v) || v <= 0) { renderProjects(); return; }
                task.duration = v;
            }
            keepTasksGroupedByMainCat(project);
            calculateProjectCPM(project);
            saveToLocalStorage();
            renderProjects();
        }

        function fillPlannedProgressToInputs(projectId) {
            const project = projects.find(p => p.id === projectId);
            if (!project) return;
            const asOfDate = document.getElementById(`progressDate-${projectId}`)?.value || formatDate(new Date());
            (project.tasks || []).forEach(task => {
                const inp = document.getElementById(`task-progress-${task.id}`);
                if (inp) {
                    const planned = getTaskPlannedProgress(task, asOfDate);
                    inp.value = Number(planned.toFixed(1));
                }
            });
            showMessage(`已帶入 ${asOfDate} 預定進度`, 'info');
        }

                            <div class="p-6 space-y-8 bg-white">
                                ${renderTaskPlanningSection(project, summary.lastTaskEndDate)}
                                ${renderProgressUpdateSection(project, progressDisplayDate)}
                            </div>
                            <div class="px-6 py-4 bg-[#FAF9F6] border-t border-[#E8E6DF] flex flex-wrap justify-between items-center gap-3">
                                <span class="text-xs text-[#73726E]">已完成 CPM 順逆推演與浮時計算</span>
                                <div class="flex flex-wrap items-center gap-3">
                                    <button data-action="show-chart-modal" data-project-id="${project.id}" class="px-5 py-2.5 text-xs font-medium bg-white hover:bg-[#F2F0E8] text-[#191918] border border-[#191918] transition">
                                        檢視分析圖表 (S-Curve · 甘特圖 · 網狀圖)
                                    </button>
                                    <button data-action="export-flagship-excel" data-project-id="${project.id}" class="px-5 py-2.5 text-xs font-medium bg-[#191918] hover:bg-[#333330] text-white transition">
                                        匯出 Excel 完整報表 (.xlsx)
                                    </button>
                                </div>
                            </div>
                        </div>
                    </article>
                `;
                projectListContainer.insertAdjacentHTML('beforeend', projectHtml);
            });
            const newScrollContainers = projectListContainer.querySelectorAll('.overflow-y-auto');
            newScrollContainers.forEach((el, idx) => {
                if (savedTableScrolls[idx] !== undefined) el.scrollTop = savedTableScrolls[idx];
            });
            window.scrollTo(0, savedWindowScrollY);
        }

        // 動態取得專案之主工項對照表 (100% 動態，絕不寫死特定案件名稱)
        function ensureProjectMainCategories(project) {
            if (!project.mainCategories || typeof project.mainCategories !== 'object') {
                project.mainCategories = {};
            }
            (project.tasks || []).forEach(t => {
                const rawCode = String(t.wbsCode || '01.1').trim();
                const catCode = t.catCode || (rawCode.includes('.') ? rawCode.split('.')[0] : rawCode) || '01';
                t.catCode = catCode;
                if (t.catName && !project.mainCategories[catCode]) {
                    project.mainCategories[catCode] = t.catName;
                }
            });
            if (Object.keys(project.mainCategories).length === 0) {
                project.mainCategories['01'] = '第一大項：主體分項工程';
            }
            return project.mainCategories;
        }

        function getTaskMainWbsInfo(task, project) {
            const rawCode = String(task.wbsCode || '01.1').trim();
            const catCode = task.catCode || (rawCode.includes('.') ? rawCode.split('.')[0] : rawCode) || '01';
            const projCats = (project && project.mainCategories) ? project.mainCategories : {};
            const catName = task.catName || projCats[catCode] || `主工項 ${catCode}`;
            return { catCode, catName };
        }

        function getNextSubWbsForCat(project, catCode) {
            let maxSub = 0;
            (project.tasks || []).forEach(t => {
                const { catCode: tc } = getTaskMainWbsInfo(t, project);
                if (tc === catCode) {
                    const parts = String(t.wbsCode || '').split('.');
                    if (parts.length > 1) {
                        const n = parseInt(parts[1], 10);
                        if (!isNaN(n) && n > maxSub) maxSub = n;
                    } else {
                        maxSub++;
                    }
                }
            });
            return `${catCode}.${maxSub + 1}`;
        }

        function onSelectMainCatChange(projectId) {
            const project = projects.find(p => p.id === projectId);
            if (!project) return;
            ensureProjectMainCategories(project);
            const sel = document.getElementById(`taskMainCatSelect-${projectId}`);
            const customWrap = document.getElementById(`customMainCatWrap-${projectId}`);
            const wbsInput = document.getElementById(`taskWbs-${projectId}`);
            if (!sel || !wbsInput) return;

            if (sel.value === '__NEW__') {
                if (customWrap) customWrap.classList.remove('hidden');
                const existingCodes = Object.keys(project.mainCategories).map(k => parseInt(k, 10)).filter(n => !isNaN(n));
                const nextCatNum = existingCodes.length > 0 ? Math.max(...existingCodes) + 1 : 1;
                const nextCatCode = String(nextCatNum).padStart(2, '0');
                const codeEl = document.getElementById(`newMainCatCode-${projectId}`);
                if (codeEl) codeEl.value = nextCatCode;
                wbsInput.value = `${nextCatCode}.1`;
            } else {
                if (customWrap) customWrap.classList.add('hidden');
                wbsInput.value = getNextSubWbsForCat(project, sel.value);
            }
        }

        // 確保同一主工項 (catCode) 的子工項在陣列中永遠相鄰不分散，避免主工項標題列重複出現
        function keepTasksGroupedByMainCat(project) {
            if (!project || !project.tasks || project.tasks.length <= 1) return;
            ensureProjectMainCategories(project);
            const groups = new Map();
            project.tasks.forEach(t => {
                const { catCode, catName } = getTaskMainWbsInfo(t, project);
                t.catCode = catCode;
                t.catName = catName;
                if (!groups.has(catCode)) groups.set(catCode, []);
                groups.get(catCode).push(t);
            });
            const sortedCatKeys = Array.from(groups.keys()).sort((a, b) => {
                const na = parseFloat(a), nb = parseFloat(b);
                if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
                return String(a).localeCompare(String(b));
            });
            const regrouped = [];
            sortedCatKeys.forEach(k => {
                regrouped.push(...groups.get(k));
            });
            project.tasks = regrouped;
        }

        function hideMainCatModal() {
            const modal = document.getElementById('main-cat-modal');
            if (modal) modal.classList.add('hidden');
        }

        function promptAddMainCategory(projectId) {
            const project = projects.find(p => p.id === projectId);
            if (!project) return;
            ensureProjectMainCategories(project);
            const existingCodes = Object.keys(project.mainCategories).map(k => parseInt(k, 10)).filter(n => !isNaN(n));
            const nextCatNum = existingCodes.length > 0 ? Math.max(...existingCodes) + 1 : 1;
            const defaultCode = String(nextCatNum).padStart(2, '0');

            document.getElementById('mainCatModalProjectId').value = projectId;
            document.getElementById('mainCatModalMode').value = 'add';
            document.getElementById('mainCatModalOldCode').value = '';
            document.getElementById('main-cat-modal-title').textContent = '新增主工項大類 (Level 1)';
            document.getElementById('mainCatModalCode').value = defaultCode;
            document.getElementById('mainCatModalCode').disabled = false;
            document.getElementById('mainCatModalName').value = '';
            document.getElementById('main-cat-modal').classList.remove('hidden');
        }

        function renameMainCategory(projectId, oldCatCode) {
            const project = projects.find(p => p.id === projectId);
            if (!project) return;
            ensureProjectMainCategories(project);
            const currentName = project.mainCategories[oldCatCode] || `主工項 ${oldCatCode}`;

            document.getElementById('mainCatModalProjectId').value = projectId;
            document.getElementById('mainCatModalMode').value = 'rename';
            document.getElementById('mainCatModalOldCode').value = oldCatCode;
            document.getElementById('main-cat-modal-title').textContent = `修改【主工項 ${oldCatCode}】名稱與編號`;
            document.getElementById('mainCatModalCode').value = oldCatCode;
            document.getElementById('mainCatModalCode').disabled = false;
            document.getElementById('mainCatModalName').value = currentName;
            document.getElementById('main-cat-modal').classList.remove('hidden');
        }

        function saveMainCatModal() {
            const projectId = document.getElementById('mainCatModalProjectId').value;
            const mode = document.getElementById('mainCatModalMode').value;
            const oldCode = document.getElementById('mainCatModalOldCode').value;
            const rawCode = document.getElementById('mainCatModalCode').value.trim();
            const rawName = document.getElementById('mainCatModalName').value.trim();
            const project = projects.find(p => p.id === projectId);
            if (!project) return;
            if (!rawCode || !rawName) {
                showMessage('請填寫完整的主工項編號與主工項名稱！', 'danger');
                return;
            }
            ensureProjectMainCategories(project);

            if (mode === 'rename') {
                if (oldCode && oldCode !== rawCode) {
                    delete project.mainCategories[oldCode];
                }
                project.mainCategories[rawCode] = rawName;
                (project.tasks || []).forEach(t => {
                    const { catCode } = getTaskMainWbsInfo(t, project);
                    if (catCode === oldCode) {
                        t.catCode = rawCode;
                        t.catName = rawName;
                        if (String(t.wbsCode || '').startsWith(oldCode + '.')) {
                            t.wbsCode = rawCode + '.' + String(t.wbsCode).slice(oldCode.length + 1);
                        }
                    }
                });
                keepTasksGroupedByMainCat(project);
                calculateProjectCPM(project);
                saveToLocalStorage();
                renderProjects();
                hideMainCatModal();
                showMessage(`主工項【${rawCode} ${rawName}】已成功更新！`, 'success');
            } else {
                project.mainCategories[rawCode] = rawName;
                const lastTask = project.tasks && project.tasks.length > 0 ? project.tasks[project.tasks.length - 1] : null;
                const newSubWbs = getNextSubWbsForCat(project, rawCode);
                const newTask = {
                    id: generateId(),
                    catCode: rawCode,
                    catName: rawName,
                    wbsCode: newSubWbs,
                    taskName: `${rawName} - 第1子工項`,
                    taskCost: 100000,
                    duration: 5,
                    predecessors: lastTask ? [{ taskId: lastTask.id, type: 'FS', lag: 0 }] : [],
                    weight: 0,
                    progressHistory: []
                };
                project.tasks.push(newTask);
                keepTasksGroupedByMainCat(project);
                calculateProjectCPM(project);
                saveToLocalStorage();
                renderProjects();
                hideMainCatModal();
                showEditTaskModal(projectId, newTask.id);
                showMessage(`已新增主工項【${rawCode} ${rawName}】並自動建立首個子工項 (${newSubWbs})！`, 'success');
            }
        }

        function quickAddSubtaskToCat(projectId, catCode) {
            const project = projects.find(p => p.id === projectId);
            if (!project) return;
            ensureProjectMainCategories(project);
            const catName = project.mainCategories[catCode] || `主工項 ${catCode}`;
            const nextWbs = getNextSubWbsForCat(project, catCode);

            // 尋找此主工項目前最後一個子工項位置與緊前工項
            let insertIdx = project.tasks.length;
            let lastTaskInCat = null;
            project.tasks.forEach((t, idx) => {
                const { catCode: tc } = getTaskMainWbsInfo(t, project);
                if (tc === catCode) {
                    insertIdx = idx + 1;
                    lastTaskInCat = t;
                }
            });
            const predTask = lastTaskInCat || (project.tasks.length > 0 ? project.tasks[project.tasks.length - 1] : null);

            const newTask = {
                id: generateId(),
                catCode: catCode,
                catName: catName,
                wbsCode: nextWbs,
                taskName: `新增子工項 (${nextWbs})`,
                taskCost: 100000,
                duration: 5,
                predecessors: predTask ? [{ taskId: predTask.id, type: 'FS', lag: 0 }] : [],
                weight: 0,
                progressHistory: []
            };
            project.tasks.splice(insertIdx, 0, newTask);
            calculateProjectCPM(project);
            saveToLocalStorage();
            renderProjects();
            showEditTaskModal(projectId, newTask.id);
            showMessage(`已於主工項【${catCode} ${catName}】下自動編碼新增子工項 ${nextWbs}！`, 'info');
        }

        function renderTaskPlanningSection(project, nextStartDate) {
            ensureProjectMainCategories(project);
            const taskMap = {};
            project.tasks.forEach(t => taskMap[t.id] = t);

            const catStats = {};
            project.tasks.forEach(t => {
                const { catCode, catName } = getTaskMainWbsInfo(t, project);
                t.catCode = catCode;
                t.catName = catName;
                if (!catStats[catCode]) {
                    catStats[catCode] = {
                        catCode,
                        catName,
                        cost: 0,
                        weight: 0,
                        minEs: null,
                        maxEf: null,
                        minEsNum: Infinity,
                        maxEfNum: 0,
                        critCount: 0,
                        items: []
                    };
                }
                const g = catStats[catCode];
                g.cost += (parseFloat(t.taskCost) || 0);
                g.weight += (parseFloat(t.weight) || 0);
                if (t.plannedStartDate && (!g.minEs || t.plannedStartDate < g.minEs)) g.minEs = t.plannedStartDate;
                if (t.plannedEndDate && (!g.maxEf || t.plannedEndDate > g.maxEf)) g.maxEf = t.plannedEndDate;
                if (typeof t.es === 'number' && t.es < g.minEsNum) g.minEsNum = t.es;
                if (typeof t.ef === 'number' && t.ef > g.maxEfNum) g.maxEfNum = t.ef;
                if (t.isCritical) g.critCount++;
                g.items.push(t);
            });

            let lastCatCode = null;
            const htmlParts = [];

            project.tasks.forEach((task, idx) => {
                const { catCode, catName } = getTaskMainWbsInfo(task, project);
                if (catCode !== lastCatCode) {
                    lastCatCode = catCode;
                    const g = catStats[catCode];
                    const spanDays = (g.maxEfNum > g.minEsNum) ? (g.maxEfNum - g.minEsNum) : getDurationDays(g.minEs, g.maxEf);
                    const gCritBadge = g.critCount > 0
                        ? `<span class="text-[11px] font-mono text-[#B84A39] whitespace-nowrap">● 含要徑 (${g.critCount})</span>`
                        : `<span class="text-[11px] font-mono text-[#73726E] whitespace-nowrap">非要徑</span>`;
                    htmlParts.push(`
                    <tr class="main-wbs-row border-t border-b border-[#D8D5CA]">
                        <td class="py-2 px-2 text-center font-mono text-xs font-semibold text-[#191918] whitespace-nowrap">${escHtml(catCode)}</td>
                        <td class="py-2 px-2.5 font-semibold text-[#191918] tracking-tight min-w-[290px]">${escHtml(catName)} <span class="ml-1 text-xs font-normal text-[#73726E]">(${g.items.length})</span></td>
                        <td class="py-2 px-2.5 text-right font-mono text-xs font-medium text-[#191918] whitespace-nowrap">${formatCurrency(g.cost)}</td>
                        <td class="py-2 px-2 text-center font-mono text-xs text-[#5A5955] whitespace-nowrap">${g.weight.toFixed(1)}%</td>
                        <td class="py-2 px-2 text-center font-mono text-xs text-[#5A5955] whitespace-nowrap">${spanDays}d</td>
                        <td class="py-2 px-2 text-center text-xs text-[#73726E] whitespace-nowrap">—</td>
                        <td class="py-2 px-2 text-center text-xs font-mono text-[#5A5955] whitespace-nowrap">${g.minEs || '—'} ~ ${g.maxEf || '—'}</td>
                        <td class="py-2 px-2 text-center text-xs font-mono text-[#73726E] whitespace-nowrap">—</td>
                        <td class="py-2 px-2 text-center whitespace-nowrap">${gCritBadge}</td>
                        <td class="py-2 px-2 text-center whitespace-nowrap">
                            <div class="flex justify-center items-center gap-1 whitespace-nowrap">
                                <button type="button" data-cat-code="${escHtml(catCode)}" onclick="quickAddSubtaskToCat('${project.id}', this.getAttribute('data-cat-code'))" class="px-2 py-0.5 text-[11px] font-medium text-[#191918] bg-white hover:bg-[#191918] hover:text-white border border-[#C8C5B9] transition whitespace-nowrap">
                                    + 子項
                                </button>
                                <button type="button" data-cat-code="${escHtml(catCode)}" onclick="renameMainCategory('${project.id}', this.getAttribute('data-cat-code'))" class="px-1.5 py-0.5 text-[11px] font-medium text-[#5A5955] hover:text-[#191918] bg-transparent hover:bg-white border border-transparent hover:border-[#C8C5B9] transition whitespace-nowrap">
                                    改名
                                </button>
                            </div>
                        </td>
                    </tr>`);
                }

                let predHtml = '<span class="text-xs text-[#A3A19A] font-mono">—</span>';
                if (task.predecessors && task.predecessors.length > 0) {
                    predHtml = task.predecessors.map(p => {
                        const predTask = taskMap[p.taskId];
                        const predLabel = predTask ? (predTask.wbsCode || predTask.taskName) : '?';
                        const lagStr = p.lag ? (p.lag > 0 ? `+${p.lag}d` : `${p.lag}d`) : '';
                        return `<span class="inline-block px-1.5 py-0.5 text-[11px] font-mono text-[#333330] bg-[#F5F4F0] border border-[#E2E0D8] whitespace-nowrap" title="${escHtml(predTask ? predTask.taskName : '')}">${escHtml(predLabel)} ${escHtml(p.type || 'FS')}${lagStr}</span>`;
                    }).join(' ');
                }

                const isCrit = task.isCritical;
                const critBadge = isCrit
                    ? '<span class="inline-flex items-center gap-1 px-1.5 py-0.5 text-[11px] font-mono font-medium text-[#B84A39] bg-[#FBF3F1] border border-[#E8C5BE] whitespace-nowrap">● 要徑</span>'
                    : `<span class="inline-flex items-center px-1.5 py-0.5 text-[11px] font-mono text-[#73726E] bg-[#F7F6F2] border border-[#E5E3DC] whitespace-nowrap">+${task.totalFloat || 0}d</span>`;

                htmlParts.push(`
                <tr class="group hover:bg-[#FAF9F5] border-b border-[#EFECE6]">
                    <td class="py-1.5 px-2 text-center font-mono text-xs text-[#73726E] pl-4 whitespace-nowrap">${escHtml(task.wbsCode || (idx + 1))}</td>
                    <td class="py-1.5 px-2.5 text-[#191918] pl-3 min-w-[290px]">
                        <input type="text" value="${escHtml(task.taskName)}" onchange="inlineUpdateTask('${project.id}', '${task.id}', 'taskName', this.value)" class="nordic-inline-input w-full text-xs font-normal text-[#191918]" title="點擊直接修改名稱">
                    </td>
                    <td class="py-1.5 px-2.5 text-right font-mono text-xs text-[#191918] whitespace-nowrap">
                        <input type="number" value="${task.taskCost}" min="0" onchange="inlineUpdateTask('${project.id}', '${task.id}', 'taskCost', this.value)" class="nordic-inline-input w-20 text-right font-mono text-xs text-[#191918]" title="點擊直接修改數值">
                    </td>
                    <td class="py-1.5 px-2 text-center font-mono text-xs text-[#73726E] whitespace-nowrap">${(task.weight || 0).toFixed(1)}%</td>
                    <td class="py-1.5 px-2 text-center font-mono text-xs text-[#191918] whitespace-nowrap">
                        <input type="number" value="${task.duration || 1}" min="1" onchange="inlineUpdateTask('${project.id}', '${task.id}', 'duration', this.value)" class="nordic-inline-input w-11 text-center font-mono text-xs text-[#191918]" title="點擊直接修改天數">
                    </td>
                    <td class="py-1.5 px-2 text-center whitespace-nowrap">${predHtml}</td>
                    <td class="py-1.5 px-2 text-center text-xs font-mono text-[#5A5955] whitespace-nowrap">${task.plannedStartDate || '—'} ~ ${task.plannedEndDate || '—'}</td>
                    <td class="py-1.5 px-2 text-center font-mono text-xs whitespace-nowrap ${isCrit ? 'text-[#B84A39]' : 'text-[#73726E]'}">
                        ${task.totalFloat ?? 0}d
                    </td>
                    <td class="py-1.5 px-2 text-center whitespace-nowrap">${critBadge}</td>
                    <td class="py-1.5 px-2 text-center whitespace-nowrap">
                        <div class="flex justify-center items-center gap-0.5 opacity-75 group-hover:opacity-100 transition-opacity whitespace-nowrap">
                            <button data-action="move-task-up" data-project-id="${project.id}" data-task-id="${task.id}" title="上移" ${idx === 0 ? 'disabled' : ''} class="px-1 py-0.5 text-[#73726E] hover:text-[#191918] disabled:opacity-25">↑</button>
                            <button data-action="move-task-down" data-project-id="${project.id}" data-task-id="${task.id}" title="下移" ${idx === project.tasks.length - 1 ? 'disabled' : ''} class="px-1 py-0.5 text-[#73726E] hover:text-[#191918] disabled:opacity-25">↓</button>
                            <button data-action="insert-task-after" data-project-id="${project.id}" data-task-id="${task.id}" title="於下方插入新子項" class="px-1 py-0.5 text-[#73726E] hover:text-[#191918]">+</button>
                            <button data-action="edit-task" data-project-id="${project.id}" data-task-id="${task.id}" title="設定前置關係" class="px-1 py-0.5 text-xs text-[#73726E] hover:text-[#191918] whitespace-nowrap">設定</button>
                            <button data-action="delete-task" data-project-id="${project.id}" data-task-id="${task.id}" title="刪除" class="px-1 py-0.5 text-xs text-[#73726E] hover:text-[#B84A39]">×</button>
                        </div>
                    </td>
                </tr>`);
            });
            const taskRows = htmlParts.join('');

            const catKeys = Object.keys(project.mainCategories).sort();
            const defaultCat = catKeys.length > 0 ? catKeys[catKeys.length - 1] : '01';
            const nextWbs = getNextSubWbsForCat(project, defaultCat);
            let mainCatOptions = '';
            catKeys.forEach(code => {
                const sel = (code === defaultCat) ? 'selected' : '';
                mainCatOptions += `<option value="${escHtml(code)}" ${sel}>${escHtml(code)} · ${escHtml(project.mainCategories[code])}</option>`;
            });
            mainCatOptions += `<option value="__NEW__">+ 新增主階段...</option>`;

            const lastTaskObj = project.tasks.length > 0 ? project.tasks[project.tasks.length - 1] : null;
            let predOptions = '<option value="">無 (起始任務)</option>';
            project.tasks.forEach(t => {
                const isLast = (lastTaskObj && lastTaskObj.id === t.id) ? 'selected' : '';
                predOptions += `<option value="${escHtml(t.id)}" ${isLast}>${escHtml(t.wbsCode ? t.wbsCode + ' ' : '')}${escHtml(t.taskName)} (${t.duration}d)</option>`;

            return `

                                + 新增主階段
                            </button>
                        </div>
                    </div>

                    <div class="overflow-x-auto border border-[#DEDCD3] mb-4">
                        <table class="min-w-full text-xs task-table">
                            <thead>
                                <tr class="border-b border-[#D8D5CA] bg-[#F7F6F2] text-[#5A5955] whitespace-nowrap">
                                    <th class="py-2.5 px-2 text-center font-medium w-12">WBS</th>
