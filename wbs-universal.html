                                    <th class="py-2.5 px-2 text-center font-medium w-12">浮時</th>
                                    <th class="py-2.5 px-2 text-center font-medium w-20">屬性</th>

                            </div>
                        </div>

                        <div id="customMainCatWrap-${project.id}" class="hidden grid grid-cols-1 md:grid-cols-12 gap-2.5 pt-2 border-t border-[#E5E3DC]">
                            <div class="md:col-span-2">
                                <label class="block text-[11px] text-[#73726E] mb-1">新階段代碼</label>
                                <input type="text" id="newMainCatCode-${project.id}" placeholder="06" class="w-full input-eng p-1.5 text-xs font-mono">

                            <div class="md:col-span-10">
                                <label class="block text-[11px] text-[#73726E] mb-1">新階段名稱</label>

                        <div class="grid grid-cols-1 md:grid-cols-12 gap-2.5 items-end pt-1">

                                <label class="block text-[11px] text-[#73726E] mb-1">前置任務</label>
                                <select id="taskPred-${project.id}" class="w-full input-eng p-2 text-xs">
                                    ${predOptions}
                                </select>

                            <div class="md:col-span-3">
                                <label class="block text-[11px] text-[#73726E] mb-1">關係類型</label>
                                <select id="taskPredType-${project.id}" class="w-full input-eng p-2 text-xs font-mono">
                                    <option value="FS">FS (完成後開始)</option>
                                    <option value="SS">SS (同時開始)</option>
                                    <option value="FF">FF (同時完成)</option>

                                <label class="block text-[11px] text-[#73726E] mb-1">延遲 Lag (天)</label>
                                <input type="number" id="taskPredLag-${project.id}" value="0" class="w-full input-eng p-2 text-xs font-mono">

                            <div class="md:col-span-2">
                                <button onclick="addTask('${project.id}')" class="w-full py-2 px-3 bg-[#191918] hover:bg-[#333330] text-white text-xs font-medium transition">
                                    + 加入排程
                                </button>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function renderProgressUpdateSection(project, asOfDate) {
            let taskRows = project.tasks.map((task) => {
                const progressForDate = task.progressHistory?.find(h => h.date === asOfDate)?.progress ?? '';
                const placeholderText = progressForDate !== '' ? '修改' : '0~100';
                return `
                <tr class="border-b border-[#EFECE6] hover:bg-[#FAF9F5]">
                    <td class="py-2 px-3 text-center font-mono text-xs text-[#73726E]">${escHtml(task.wbsCode || '')}</td>
                    <td class="py-2 px-3 text-xs text-[#191918]">${escHtml(task.taskName)}</td>
                    <td class="py-2 px-3 text-center font-mono text-xs text-[#73726E]" id="task-planned-progress-${task.id}">${getTaskPlannedProgress(task, asOfDate).toFixed(1)}%</td>
                    <td id="task-total-progress-${task.id}" class="py-2 px-3 text-center font-mono text-xs font-medium text-[#191918]">${getTaskProgressAsOf(task, asOfDate).toFixed(1)}%</td>
                    <td class="py-2 px-3 text-center">
                        <div class="inline-flex items-center gap-1">
                            <input type="number" id="task-progress-${task.id}" value="${progressForDate}" min="0" max="100" class="w-20 p-1 text-center font-mono text-xs input-eng" placeholder="${placeholderText}">
                            <span class="text-xs text-[#73726E]">%</span>
                        </div>
                    </td>
                </tr>`;
            }).join('');

            return `
                <div>
                    <div class="flex flex-wrap items-center justify-between gap-3 mb-3 pb-2 border-b border-[#191918]">
                        <h3 class="text-sm font-semibold uppercase tracking-wider text-[#191918]">02 / 實際進度回報 (Progress Tracking)</h3>
                        <div class="flex items-center flex-wrap gap-2">
                            <label for="progressDate-${project.id}" class="text-xs text-[#73726E]">查核基準日</label>
                            <input type="date" id="progressDate-${project.id}" value="${asOfDate}" onchange="loadProgressForDate('${project.id}')" class="p-1.5 input-eng text-xs font-mono">
                            <button type="button" onclick="fillPlannedProgressToInputs('${project.id}')" class="px-3 py-1.5 text-xs font-medium text-[#191918] bg-white hover:bg-[#F2F0E8] border border-[#D8D6CE] transition">帶入當日預定進度</button>
                            <button type="button" onclick="clearProgressInputs('${project.id}')" class="px-2.5 py-1.5 text-xs text-[#73726E] hover:text-[#191918] transition">清空</button>
                            <button type="button" onclick="saveAllTaskProgress('${project.id}')" class="px-4 py-1.5 text-xs font-medium bg-[#191918] hover:bg-[#333330] text-white transition">儲存進度</button>
                        </div>
                    </div>
                    <div class="overflow-x-auto border border-[#DEDCD3] max-h-[280px] overflow-y-auto">
                        <table class="min-w-full text-xs task-table">
                            <thead>
                                <tr class="border-b border-[#D8D5CA] bg-[#F7F6F2] text-[#5A5955]">
                                    <th class="py-2 px-3 text-center font-medium w-16">WBS</th>
                                    <th class="py-2 px-3 text-left font-medium">任務名稱</th>
                                    <th class="py-2 px-3 text-center font-medium w-28">預定累積</th>
                                    <th class="py-2 px-3 text-center font-medium w-28">實際累積</th>
                                    <th class="py-2 px-3 text-center font-medium w-32">本期填報 (%)</th>
                                </tr>
                            </thead>
                            <tbody>${taskRows || '<tr><td colspan="5" class="p-4 text-center text-[#73726E]">尚無任務資料</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>`;
        }
        let currentModalProjectId = null;
        let isWideChartView = true;

        function applyWideChartLayout(project) {
            const innerWrappers = document.querySelectorAll('#chart-modal .chart-wide-inner');
            const btn = document.getElementById('wideChartToggleBtn');
            const dur = project ? (project.contractDuration || 180) : 180;
            const nTasks = project && project.tasks ? project.tasks.length : 15;
            const widePx = Math.max(1800, Math.min(3400, dur * 4 + 500));
            innerWrappers.forEach(el => {
                if (isWideChartView && (dur > 150 || nTasks > 18)) {
                    el.style.minWidth = widePx + 'px';
                    el.style.width = widePx + 'px';
                } else if (isWideChartView) {
                    el.style.minWidth = '1500px';
                    el.style.width = '1500px';
                } else {
                    el.style.minWidth = '100%';
                    el.style.width = '100%';
                }
            });
            if (btn) {
                btn.textContent = isWideChartView ? '檢視模式：寬幅展開' : '檢視模式：適應視窗';
                btn.className = 'px-3 py-1 text-xs font-medium border border-[#D5D3CB] bg-white text-[#191918] hover:bg-[#191918] hover:text-white transition';
            }
        }

        function toggleWideChartView() {
            isWideChartView = !isWideChartView;
            const project = projects.find(p => p.id === currentModalProjectId);
            applyWideChartLayout(project);
            const activeTabBtn = document.querySelector('#chart-modal .tab-button.active');
            const tabName = activeTabBtn ? activeTabBtn.dataset.tab : 'comparison';
            setTimeout(() => drawChartsForTab(tabName, currentModalProjectId), 30);
        }

        function showChartModal(projectId) {
            currentModalProjectId = projectId;
            const project = projects.find(p => p.id === projectId);
            if (!project) return;
            document.getElementById('modal-project-title').textContent = project.name;
            document.getElementById('chart-modal').classList.remove('hidden');
            document.querySelectorAll('#chart-modal button').forEach(btn => btn.dataset.projectId = projectId);
            applyWideChartLayout(project);
            const activeTabButton = document.querySelector('.tab-button.active') || document.getElementById('tab-btn-comparison');
            switchChartTab(activeTabButton);
        }

        function hideChartModal() {
            ['plannedSCurveCanvas', 'plannedGanttCanvas', 'plannedCombinedCanvas', 'actualSCurveCanvas', 'comparisonSCurveCanvas'].forEach(id => {
                const canvas = document.getElementById(id);
                if (canvas) {
                    const chart = Chart.getChart(canvas);
                    if (chart) chart.destroy();
                }
            });
            document.getElementById('chart-modal').classList.add('hidden');
        }

        function switchChartTab(button) {
            const tabName = button.dataset.tab;
            const projectId = button.dataset.projectId || currentModalProjectId;
            ['planned', 'actual', 'comparison', 'network'].forEach(t => {
                const contentEl = document.getElementById(`tab-content-${t}`);
                const btnEl = document.getElementById(`tab-btn-${t}`);
                if (contentEl) contentEl.classList.add('hidden');
                if (btnEl) btnEl.classList.remove('active');
            });
            const targetContent = document.getElementById(`tab-content-${tabName}`);
            if (targetContent) targetContent.classList.remove('hidden');
            button.classList.add('active');
            setTimeout(() => drawChartsForTab(tabName, projectId), 50);
        }

        function drawEmptyChartMessage(canvasId, message) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const chart = Chart.getChart(canvas);
            if (chart) chart.destroy();

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#64748B';
            ctx.font = '16px "Noto Sans TC"';
            ctx.fillText(message, canvas.width / 2, canvas.height / 2);
            ctx.restore();
        }

        let currentChartTimeScaleMode = 'auto';

        function onChartTimeScaleChange(mode) {
            currentChartTimeScaleMode = mode || 'auto';
            const activeTabBtn = document.querySelector('#chart-modal .tab-button.active');
            const tabName = activeTabBtn ? activeTabBtn.dataset.tab : 'comparison';
            drawChartsForTab(tabName, currentModalProjectId);
        }

        function drawChartsForTab(tabName, projectId) {
            const targetId = projectId || currentModalProjectId;
            const project = projects.find(p => p.id === targetId);
            const asOfDate = project?.ui_selectedProgressDate || formatDate(new Date());
            const chartCanvasIds = ['plannedSCurveCanvas', 'plannedGanttCanvas', 'plannedCombinedCanvas', 'actualSCurveCanvas', 'comparisonSCurveCanvas'];

            if (!project || !project.startDate || !project.plannedCompletionDate || isNaN(new Date(project.startDate)) || isNaN(new Date(project.plannedCompletionDate))) {
                const errorMessage = "專案日期範圍無效，無法繪製圖表。";
                chartCanvasIds.forEach(id => { if (document.getElementById(id)) drawEmptyChartMessage(id, errorMessage) });
                return;
            }

            if (!project.tasks || project.tasks.length === 0) {
                const emptyMessage = "尚無分項工程數據可供繪製圖表";
                chartCanvasIds.forEach(id => { if (document.getElementById(id)) drawEmptyChartMessage(id, emptyMessage) });
                return;
            }

            try {
                if (tabName === 'planned') drawPlannedCharts(project);
                else if (tabName === 'actual') drawActualCharts(project, asOfDate);
                else if (tabName === 'comparison') drawComparisonCharts(project, asOfDate);
                else if (tabName === 'network') drawPdmNetworkChart(project);
            } catch (e) {
                console.error("Chart drawing failed:", e);
                showMessage("繪製圖表時發生錯誤，請檢查主控台紀錄。", "danger");
            }
        }

        const whiteBackgroundPlugin = {
            id: 'whiteBackground',
            beforeDraw: (chart) => {
                const { ctx } = chart;
                ctx.save();
                ctx.globalCompositeOperation = 'destination-over';
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, chart.width, chart.height);
                ctx.restore();
            }
        };

        const todayLinePlugin = {
            id: 'todayLine',
            afterDatasetsDraw(chart) {
                const { ctx, chartArea: { top, bottom, left, right }, scales: { x } } = chart;
                if (x.type !== 'time' || !x.min || !x.max) return;
                const today = new Date().setHours(0, 0, 0, 0);
                if (today < x.min || today > x.max) return;

                const xValue = x.getPixelForValue(today);
                if (xValue >= left && xValue <= right) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(xValue, top);
                    ctx.lineTo(xValue, bottom);
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#DC2626';
                    ctx.setLineDash([5, 5]);
                    ctx.stroke();
                    ctx.fillStyle = '#DC2626';
                    ctx.font = 'bold 12px "Noto Sans TC"';
                    ctx.textAlign = 'center';
                    ctx.fillText('今日', xValue, top - 8);
                    ctx.restore();
                }
            }
        };

        Chart.register(whiteBackgroundPlugin, todayLinePlugin, ChartDataLabels);
        Chart.defaults.plugins.datalabels.color = '#334155';

        const chartDefaultOptions = (title, minDate, maxDate) => {
            const isDaily = currentChartTimeScaleMode === 'day';
            const isWeekly = currentChartTimeScaleMode === 'week';
            return {
                responsive: true, maintainAspectRatio: false,
                plugins: {
                    legend: { labels: { color: '#1E293B', font: { size: 13, weight: 'bold' } } },
                    title: { display: true, text: title, color: '#0E1B2E', font: { size: 16, weight: 'bold' } },
                    tooltip: {
                        mode: 'index', intersect: false,
                        backgroundColor: 'rgba(14, 27, 46, 0.95)', titleFont: { size: 14 }, bodyFont: { size: 13 },
                        callbacks: {
                            label: function (context) {
                                let label = context.dataset.label || '';
                                if (context.dataset.type === 'bar' || context.dataset.backgroundColor) {
                                    const proj = projects.find(p => p.id === currentModalProjectId) || projects[0];
                                    const task = proj?.tasks?.[context.dataIndex];
                                    if (task) {
                                        if (context.datasetIndex === 0) {
                                            return `${label}: ${task.plannedStartDate} ~ ${task.plannedEndDate} (工期 ${task.duration}天)`;
                                        } else if (context.datasetIndex === 1 && task.totalFloat > 0) {
                                            return `${label}: 最晚完成 ${task.lateEndDate} (總浮時 TF=${task.totalFloat}天 / 自由浮時 FF=${task.freeFloat ?? 0}天)`;
                                        }
                                    }
                                    const raw = context.raw;
                                    let start, end;
                                    if (typeof raw === 'object' && raw.x) { [start, end] = raw.x; }
                                    else if (Array.isArray(context.raw)) { [start, end] = context.raw; }
                                    if (start && end) {
                                        const duration = Math.max(1, getDurationDays(start, end) - 1);
                                        return `${label}: ${formatDate(start)} ~ ${formatDate(end)} (${duration}天)`;
                                    }
                                }
                                if (context.parsed.y !== null) { return `${label}: ${context.parsed.y.toFixed(2)}%`; }
                                return label;
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        type: 'time',
                        time: {
                            unit: isWeekly ? 'week' : 'day',
                            stepSize: 1,
                            displayFormats: {
                                day: 'MM/dd',
                                week: 'MM/dd',
                                month: 'yyyy/MM'
                            }
                        },
                        afterBuildTicks: isDaily ? function (axis) {
                            if (!minDate || !maxDate) return;
                            const ticks = [];
                            for (let d = new Date(minDate); d <= new Date(maxDate); d.setDate(d.getDate() + 1)) {
                                ticks.push({ value: d.getTime(), major: false });
                            }
                            axis.ticks = ticks;
                        } : undefined,
                        grid: { color: '#F1F5F9' },
                        ticks: {
                            color: '#475569',
                            font: { size: isDaily ? 8.5 : 11, weight: '600' },
                            minRotation: isDaily ? 90 : 0,
                            maxRotation: isDaily ? 90 : (isWeekly ? 45 : 0),
                            autoSkip: !isDaily,
                            maxTicksLimit: isDaily ? 1000 : (isWeekly ? 60 : 12),
                            callback: function (val) {
                                const d = new Date(val);
                                if (isNaN(d.getTime())) return '';
                                const m = String(d.getMonth() + 1).padStart(2, '0');
                                const day = String(d.getDate()).padStart(2, '0');
                                return `${m}/${day}`;
                            }
                        },
                        min: minDate, max: maxDate,
                        title: { display: true, text: '期程日期 (月/日)', color: '#0E1B2E', font: { weight: 'bold' } }
                    },
                    y: {
                        grid: { color: '#F1F5F9' },
                        ticks: { color: '#1E293B', font: { weight: 'bold' } },
                        title: { display: true, text: '分項工程', color: '#0E1B2E', font: { weight: 'bold' } },
                        stacked: false
                    }
                }
            };
        };

        function createOrUpdateChart(canvasId, config) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const existingChart = Chart.getChart(canvas);
            if (existingChart) {
                existingChart.destroy();
            }
            return new Chart(canvas.getContext('2d'), config);
        }

        function drawPlannedCharts(project) {
            const dateLabels = [], earlyData = [], lateData = [];
            for (let d = new Date(project.startDate); d <= new Date(project.plannedCompletionDate); d.setDate(d.getDate() + 1)) {
                const dateStr = formatDate(d);
                dateLabels.push(dateStr);
                earlyData.push(getProjectEarlyProgressAtDate(project, dateStr));
                lateData.push(getProjectLateProgressAtDate(project, dateStr));
            }

            const defSCurveOpts = chartDefaultOptions('預定排程香蕉雙包絡 S 曲線 (早期 vs. 晚期)', project.startDate, project.plannedCompletionDate);
            createOrUpdateChart('plannedSCurveCanvas', {
                type: 'line',
                data: {
                    labels: dateLabels,
                    datasets: [
                        { label: '早期排程 S 曲線 (ES Upper Bound)', data: earlyData, borderColor: '#059669', borderWidth: 2.5, tension: 0.35, pointRadius: 0 },
                        { label: '晚期容許 S 曲線 (LS Lower Bound)', data: lateData, borderColor: '#DC2626', borderDash: [5, 5], borderWidth: 2, tension: 0.35, pointRadius: 0, fill: '-1', backgroundColor: 'rgba(217, 119, 6, 0.12)' }
                    ]
                },
                options: {
                    ...defSCurveOpts,
                    layout: { padding: { right: 60 } },
                    scales: {
                        x: defSCurveOpts.scales.x,
                        y: { min: 0, max: 100, title: { display: true, text: '累積進度 (%)', color: '#1E293B' }, ticks: { callback: v => v + '%' } }
                    },
                    plugins: {
                        ...defSCurveOpts.plugins,
                        datalabels: { display: false }
                    }
                }
            });

            // 專業工程甘特圖：要徑亮紅條、非要徑深藍條、總浮時 (Total Float) 琥珀色半透明寬限條
            const ganttWrapEl = document.getElementById('plannedGanttCanvas')?.parentElement;
            if (ganttWrapEl) {
                const dynamicGanttHeight = Math.max(480, (project.tasks?.length || 10) * 34 + 110);
                ganttWrapEl.style.minHeight = dynamicGanttHeight + 'px';
                ganttWrapEl.style.height = dynamicGanttHeight + 'px';
            }
            const ganttMaxDate = formatDate(new Date(new Date(project.plannedCompletionDate).getTime() + MS_PER_DAY));
            const defGanttOpts = chartDefaultOptions('要徑甘特圖 (CPM Gantt Chart ＆ 總浮時展示)', project.startDate, ganttMaxDate);
            createOrUpdateChart('plannedGanttCanvas', {
                type: 'bar',
                data: {
                    labels: project.tasks.map(t => `${t.wbsCode ? t.wbsCode + ' ' : ''}${t.taskName}`),
                    datasets: [
                        {
                            label: '分項工程作業工期',
                            data: project.tasks.map(t => [t.plannedStartDate, t.ganttEarlyEnd || t.plannedEndDate]),
                            backgroundColor: project.tasks.map(t => t.isCritical ? '#DC2626' : '#2563EB'),
                            borderRadius: 4,
                            borderWidth: 1,
                            borderColor: project.tasks.map(t => t.isCritical ? '#991B1B' : '#1D4ED8'),
                            barPercentage: 0.6,
                            maxBarThickness: 22
                        },
                        {
                            label: '總浮時寬限緩衝',
                            data: project.tasks.map(t => {
                                const eEnd = t.ganttEarlyEnd || t.plannedEndDate;
                                const lEnd = t.ganttLateEnd || t.lateEndDate;
                                return (t.totalFloat > 0 && eEnd && lEnd && eEnd !== lEnd) ? [eEnd, lEnd] : [eEnd, eEnd];
                            }),
                            backgroundColor: project.tasks.map(t => (t.totalFloat > 0 && t.plannedEndDate !== t.lateEndDate) ? 'rgba(245, 158, 11, 0.45)' : 'transparent'),
                            borderColor: project.tasks.map(t => (t.totalFloat > 0 && t.plannedEndDate !== t.lateEndDate) ? '#D97706' : 'transparent'),
                            borderWidth: 1.5,
                            borderDash: [4, 4],
                            borderRadius: 4,
                            barPercentage: 0.35,
                            maxBarThickness: 14
                        }
                    ]
                },
                options: {
                    ...defGanttOpts,
                    indexAxis: 'y',
                    layout: { padding: { left: 10, right: 120, top: 10, bottom: 15 } },
                    scales: {
                        x: {
                            ...defGanttOpts.scales.x,
                            stacked: false,
                            title: { display: true, text: '期程日期 (月/日)', color: '#0E1B2E', font: { weight: 'bold' } }

        function drawComparisonCharts(project, asOfDate) {
            const dateLabels = [], earlyData = [], lateData = [], actualData = [];

            // 尋找各工項實際進度回報的最晚基準日 (Data Date)
            let latestReportDate = null;
            project.tasks.forEach(t => {
                if (t.progressHistory) {
                    t.progressHistory.forEach(h => {
                        if (!latestReportDate || h.date > latestReportDate) {
                            latestReportDate = h.date;
                        }
                    });
                }
            });
            const dataDate = latestReportDate || asOfDate || formatDate(new Date());

            for (let d = new Date(project.startDate); d <= new Date(project.plannedCompletionDate); d.setDate(d.getDate() + 1)) {
                const dateStr = formatDate(d);
                dateLabels.push(dateStr);

                const earlyVal = getProjectEarlyProgressAtDate(project, dateStr);
                const lateVal = getProjectLateProgressAtDate(project, dateStr);
                earlyData.push(earlyVal);
                lateData.push(lateVal);

                // 實際進度只繪製到最新回報基準日，未來日期填入 null 避免亂畫假進度
                if (dateStr <= dataDate) {
                    const totalCost = project.tasks.reduce((s, t) => s + (parseFloat(t.taskCost) || 0), 0);
                    let actualVal = 0;
                    if (totalCost > 0) {
                        project.tasks.forEach(task => {
                            const weight = (parseFloat(task.taskCost) || 0) / totalCost;
                            actualVal += (getTaskProgressAsOf(task, dateStr) / 100) * weight;
                        });
                        actualVal *= 100;
                    }
                    actualData.push(actualVal);
                } else {
                    actualData.push(null);
                }
            }

            // --- EVM 實獲值管理指標精算 ---
            const totalBAC = project.tasks.reduce((sum, t) => sum + (parseFloat(t.taskCost) || 0), 0);
            const currentEarlyPct = getProjectEarlyProgressAtDate(project, dataDate);
            const currentLatePct = getProjectLateProgressAtDate(project, dataDate);

            let currentActualPct = 0;
            if (totalBAC > 0) {
                project.tasks.forEach(task => {
                    const weight = (parseFloat(task.taskCost) || 0) / totalBAC;
                    currentActualPct += (getTaskProgressAsOf(task, dataDate) / 100) * weight;
                });
                currentActualPct *= 100;
            }

            const PV = totalBAC * (currentEarlyPct / 100);
            const PV_late = totalBAC * (currentLatePct / 100);
            const EV = totalBAC * (currentActualPct / 100);
            const SV_cost = EV - PV;
            const SV_pct = currentActualPct - currentEarlyPct;
            const SPI = currentEarlyPct > 0 ? (currentActualPct / currentEarlyPct) : 1.0;
            const bananaBufferMargin = currentActualPct - currentLatePct;

            // 香蕉包絡狀態判定

            // 繪製雙包絡香蕉曲線
            createOrUpdateChart('comparisonSCurveCanvas', {

            offCanvas.height = chartH;

            const dateLabels = [], earlyData = [], lateData = [], actualData = [];
            let latestReportDate = null;
            project.tasks.forEach(t => {
                if (t.progressHistory) {
                    t.progressHistory.forEach(h => {
                        if (!latestReportDate || h.date > latestReportDate) latestReportDate = h.date;
                    });

            });
            const dataDate = latestReportDate || project.ui_selectedProgressDate || formatDate(new Date());

            for (let d = new Date(project.startDate); d <= new Date(project.plannedCompletionDate); d.setDate(d.getDate() + 1)) {

                dateLabels.push(dateStr);

                    if (totalBAC > 0) {
                        project.tasks.forEach(task => {
                            const w = (parseFloat(task.taskCost) || 0) / totalBAC;
                            aVal += (getTaskProgressAsOf(task, dateStr) / 100) * w;
                        });
                        aVal *= 100;
                    }
                    actualData.push(aVal);
                } else {
                    actualData.push(null);
                }
            }

            const baseXScale = {
                type: 'time',
                time: {
                    unit: 'day',
                    stepSize: dur > 360 ? 15 : (dur > 120 ? 7 : 3),
                    displayFormats: { day: 'yyyy/MM/dd', week: 'yyyy/MM/dd', month: 'yyyy/MM' }
                },
                min: project.startDate,
                max: isGantt ? formatDate(new Date(new Date(project.plannedCompletionDate).getTime() + MS_PER_DAY)) : project.plannedCompletionDate,
                grid: { color: '#E2E8F0' },
                ticks: {

        function excelColLetter(colNum) {
            let temp, letter = '';
            while (colNum > 0) {
                temp = (colNum - 1) % 26;
                letter = String.fromCharCode(temp + 65) + letter;
                colNum = (colNum - temp - 1) / 26;
            }
            return letter;
        }

        function buildMilestoneRowsForProject(project, dailyRows) {
            if (!dailyRows || dailyRows.length === 0) return [];
            const startDt = dailyRows[0].dateStr;
            const endDt = dailyRows[dailyRows.length - 1].dateStr;
            const selectedDates = new Set([startDt]);

            for (let i = 0; i < dailyRows.length; i++) {
                const cur = dailyRows[i].dateStr;
                const next = (i + 1 < dailyRows.length) ? dailyRows[i + 1].dateStr : null;
                if (!next || cur.slice(0, 7) !== next.slice(0, 7)) {
                    selectedDates.add(cur);
                }
            }
            selectedDates.add(endDt);

            // 若工期較短 (<90天) 導致節點太少，每 15 天補一個節點
            if (selectedDates.size < 6) {
                for (let i = 14; i < dailyRows.length; i += 15) {
                    selectedDates.add(dailyRows[i].dateStr);
                }
            }

            const dailyMap = {};
            dailyRows.forEach(r => { dailyMap[r.dateStr] = r; });

            const sortedDates = Array.from(selectedDates).sort();
            return sortedDates.map((dStr, idx) => {
                const dRow = dailyMap[dStr];
                // 自動彙整該日期正在執行或剛完成的重點 WBS 工序
                const activeCrit = [];
                const activeNonCrit = [];
                (project.tasks || []).forEach(t => {
                    const es = t.plannedStartDate || '';
                    const ef = t.plannedEndDate || '';
                    if (es <= dStr && dStr <= ef) {
                        const label = `${t.wbsCode || ''} ${t.taskName}`;
                        if (t.isCritical) activeCrit.push(`【要徑】${label}`);
                        else activeNonCrit.push(label);
                    }
                });
                let focusNote = '';
                const combined = [...activeCrit, ...activeNonCrit];
                if (idx === 0) {
                    focusNote = `【開工啟動基準日 Day 1】` + (combined.slice(0, 3).join('、') || '專案正式申報開工動員');
                } else if (dStr === endDt) {
                    const lastTasks = (project.tasks || []).slice(-3).map(t => `${t.wbsCode || ''} ${t.taskName}`);
                    focusNote = `【全案竣工查驗交屋 100.00%】` + (lastTasks.join('、') || '全案竣工驗收完成');
                } else if (combined.length > 0) {
                    focusNote = combined.slice(0, 3).join('；') + (combined.length > 3 ? ` 等共 ${combined.length} 項工序推進` : ' 推進');
                } else {
                    focusNote = '依計畫排程跨階段工序銜接與查核推進';
                }
                return {
                    dateStr: dStr,
                    dayNo: dRow.dayNo,
                    esPct: dRow.earlyVal / 100.0,
                    lsPct: dRow.lateVal / 100.0,
                    focusNote
                };
            });
        }


        function renderPdmNetworkToCanvas(project, canvas) {
            if (!canvas || !project || !project.tasks) return canvas;
            calculateProjectCPM(project);
            const taskMap = {};
            const succMap = {};
            project.tasks.forEach(t => { taskMap[t.id] = t; succMap[t.id] = []; });
            project.tasks.forEach(t => {
                (t.predecessors || []).forEach(p => {
                    if (succMap[p.taskId]) {
                        const lagN = parseInt(p.lag) || 0;
                        const lagS = lagN > 0 ? `+${lagN}d` : (lagN < 0 ? `${lagN}d` : '');
                        succMap[p.taskId].push(`${t.wbsCode || ''}(${p.type || 'FS'}${lagS})`);
                    }
                });
            });

            const critTasks = project.tasks.filter(t => t.isCritical).sort((a, b) => (a.es ?? 0) - (b.es ?? 0));
            const nonCritTasks = project.tasks.filter(t => !t.isCritical).sort((a, b) => ((a.es ?? 0) - (b.es ?? 0)) || String(a.wbsCode).localeCompare(String(b.wbsCode)));

            // 動態分階：每階段最多 6 個要徑節點，階段標題自動取該階段首尾要徑工項名稱 (100% 動態不寫死)
            const perStage = 6;
            const numStages = Math.max(1, Math.ceil(critTasks.length / perStage));
            const stages = [];
            for (let s = 0; s < numStages; s++) {
                const sc = critTasks.slice(s * perStage, (s + 1) * perStage);
                if (sc.length === 0) continue;
                const minEs = sc[0].es ?? 0;
                const nextEs = (s < numStages - 1 && critTasks[(s + 1) * perStage]) ? (critTasks[(s + 1) * perStage].es ?? 99999) : 99999;
                const nc = nonCritTasks.filter(t => (t.es ?? 0) >= minEs && (t.es ?? 0) < nextEs);
                const cFirstName = (sc[0].taskName || '').slice(0, 14);
                const cLastName = (sc[sc.length - 1].taskName || '').slice(0, 14);
                stages.push({
                    title: `第 ${s + 1} 階段 (Stage ${s + 1})：[${sc[0].wbsCode}] ${cFirstName}… ──► [${sc[sc.length - 1].wbsCode}] ${cLastName}…`,
                    crit: sc,
                    upper: nc.filter((_, i) => i % 2 === 0).slice(0, 6),
                    lower: nc.filter((_, i) => i % 2 === 1).slice(0, 6)
                });
            }

            const W = 2400, H = Math.max(1050, 130 + stages.length * 422);
            canvas.width = W;
            canvas.height = H;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#F8FAFC';
            ctx.fillRect(0, 0, W, H);

            // Title Header Banner
            ctx.fillStyle = '#0F172A';
            ctx.fillRect(24, 18, W - 48, 78);
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 24px "Microsoft JhengHei", sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(`${project.name} — MS Project 標準 PDM 要徑邏輯網狀圖 (正交泳道無交叉節點圖)`, 44, 44);
            ctx.fillStyle = '#94A3B8';
            ctx.font = 'bold 14px "Microsoft JhengHei", sans-serif';
            ctx.fillText(`總工期：${project.contractDuration || 280} 日曆天 (${project.startDate} ~ ${project.plannedCompletionDate}) ｜ 總預算：NT$ ${formatCurrency(project.contractSum)} ｜ 共 ${project.tasks.length} 個節點 (${critTasks.length} 項要徑 TF=0 ＋ ${nonCritTasks.length} 項並聯浮時作業)`, 44, 74);

            // Legend Boxes
            ctx.fillStyle = '#FEF2F2'; ctx.strokeStyle = '#DC2626'; ctx.lineWidth = 2;
            ctx.fillRect(W - 680, 28, 310, 56); ctx.strokeRect(W - 680, 28, 310, 56);
            ctx.fillStyle = '#991B1B'; ctx.font = 'bold 13px "Microsoft JhengHei", sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('■ 紅色節點＋實線紅箭頭：要徑主幹 (TF=0)', W - 525, 46);
            ctx.fillText('決定全案完工日之 100% 連續核心主幹', W - 525, 68);

            ctx.fillStyle = '#EFF6FF'; ctx.strokeStyle = '#2563EB';
            ctx.fillRect(W - 350, 28, 310, 56); ctx.strokeRect(W - 350, 28, 310, 56);
            ctx.fillStyle = '#1E40AF';
            ctx.fillText('■ 藍色節點＋正交垂直通道：並聯支線 (TF>0)', W - 195, 46);
            ctx.fillText('正交對齊主幹道上下方，零斜線交叉干擾', W - 195, 68);

            const boxW = 310, boxH = 92;

            function drawArrow(x1, y1, x2, y2, color, lw, dashed) {
                ctx.save();
                ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw;
                if (dashed) ctx.setLineDash([5, 4]);
                ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
                ctx.setLineDash([]);
                const angle = Math.atan2(y2 - y1, x2 - x1);
                const headLen = 10;
                ctx.beginPath();
                ctx.moveTo(x2, y2);
                ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
                ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
                ctx.closePath(); ctx.fill();
                ctx.restore();
            }

            function drawNodeBox(t, cx, cy, w, h) {
                const x0 = cx - w / 2, y0 = cy - h / 2;
                const isC = !!t.isCritical;
                const borderCol = isC ? '#DC2626' : '#2563EB';
                const hdrBg = isC ? '#FEE2E2' : '#DBEAFE';
                const footBg = isC ? '#FEF2F2' : '#EFF6FF';
                const txtCol = isC ? '#7F1D1D' : '#1E3A8A';

                ctx.fillStyle = 'rgba(148, 163, 184, 0.30)';
                ctx.fillRect(x0 + 3, y0 + 3, w, h);

                ctx.fillStyle = '#FFFFFF';
                ctx.strokeStyle = borderCol;
                ctx.lineWidth = isC ? 2.5 : 1.8;
                ctx.fillRect(x0, y0, w, h);

                const hBar = Math.round(h * 0.28);
                ctx.fillStyle = hdrBg; ctx.fillRect(x0, y0, w, hBar);
                ctx.fillStyle = footBg; ctx.fillRect(x0, y0 + h - hBar, w, hBar);

                ctx.strokeRect(x0, y0, w, h);
                ctx.beginPath();
                ctx.moveTo(x0, y0 + hBar); ctx.lineTo(x0 + w, y0 + hBar);
                ctx.moveTo(x0, y0 + h - hBar); ctx.lineTo(x0 + w, y0 + h - hBar);
                const w3 = w / 3;
                ctx.moveTo(x0 + w3, y0); ctx.lineTo(x0 + w3, y0 + hBar);
                ctx.moveTo(x0 + 2 * w3, y0); ctx.lineTo(x0 + 2 * w3, y0 + hBar);
                ctx.moveTo(x0 + w3, y0 + h - hBar); ctx.lineTo(x0 + w3, y0 + h);
                ctx.moveTo(x0 + 2 * w3, y0 + h - hBar); ctx.lineTo(x0 + 2 * w3, y0 + h);
                ctx.stroke();

                const esD = (t.es ?? 0) + 1;
                const efD = t.ef ?? esD;
                const lsD = (t.ls ?? 0) + 1;
                const lfD = t.lf ?? efD;
                const tfD = t.totalFloat ?? 0;

                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.font = 'bold 11.5px "Microsoft JhengHei", sans-serif';
                ctx.fillStyle = txtCol; ctx.fillText(`ES: D${esD}`, x0 + w3 * 0.5, y0 + hBar / 2);
                ctx.fillStyle = isC ? '#B91C1C' : '#1D4ED8'; ctx.fillText(`工期: ${t.duration}天`, x0 + w3 * 1.5, y0 + hBar / 2);
                ctx.fillStyle = txtCol; ctx.fillText(`EF: D${efD}`, x0 + w3 * 2.5, y0 + hBar / 2);

                const shortName = (t.taskName || '').length > 17 ? t.taskName.slice(0, 16) + '…' : (t.taskName || '');
                ctx.fillStyle = '#0F172A'; ctx.font = 'bold 13px "Microsoft JhengHei", sans-serif';
                ctx.fillText(`[${t.wbsCode || ''}] ${shortName}`, cx, cy - 6);
                ctx.fillStyle = '#475569'; ctx.font = '11.5px "Microsoft JhengHei", sans-serif';
                const sShort = (t.plannedStartDate || '').slice(5).replace('-', '/');
                const eShort = (t.plannedEndDate || '').slice(5).replace('-', '/');
                ctx.fillText(`${sShort}~${eShort} ($${formatCurrency(t.taskCost)} / ${(t.weight || 0).toFixed(2)}%)`, cx, cy + 12);

                ctx.font = 'bold 11.5px "Microsoft JhengHei", sans-serif';
                ctx.fillStyle = '#475569'; ctx.fillText(`LS: D${lsD}`, x0 + w3 * 0.5, y0 + h - hBar / 2);
                ctx.fillStyle = isC ? '#DC2626' : '#2563EB'; ctx.fillText(isC ? '★要徑 TF=0' : `浮時 +${tfD}天`, x0 + w3 * 1.5, y0 + h - hBar / 2);
                ctx.fillStyle = '#475569'; ctx.fillText(`LF: D${lfD}`, x0 + w3 * 2.5, y0 + h - hBar / 2);
            }

            const stageH = 410;
            stages.forEach((stg, sIdx) => {
                const yTop = 112 + sIdx * 422;
                ctx.fillStyle = sIdx % 2 === 0 ? '#F1F5F9' : '#FFFFFF';
                ctx.strokeStyle = '#CBD5E1'; ctx.lineWidth = 1.5;
                ctx.fillRect(24, yTop, W - 48, stageH);
                ctx.strokeRect(24, yTop, W - 48, stageH);

                // Stage Header
                ctx.fillStyle = '#1E293B';
                ctx.fillRect(24, yTop, W - 48, 30);
                ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold 14px "Microsoft JhengHei", sans-serif';
                ctx.textAlign = 'left';
                const c0 = stg.crit[0], cLast = stg.crit[stg.crit.length - 1];
                ctx.fillText(`■ ${stg.title} (D${(c0.es ?? 0) + 1} ~ D${cLast.ef ?? 1})`, 40, yTop + 15);

                const ySpine = yTop + 215;
                const yUpper = yTop + 88;
                const yLower = yTop + 342;
                const slotXs = [215, 595, 975, 1355, 1735, 2115];

                // Draw Critical Spine Nodes & Horizontal Red Arrows
                stg.crit.forEach((ct, i) => {
                    const cx = slotXs[i] || (215 + i * 380);
                    drawNodeBox(ct, cx, ySpine, boxW, boxH);
                    if (i < stg.crit.length - 1) {
                        const nx = slotXs[i + 1] || (215 + (i + 1) * 380);
                        drawArrow(cx + boxW / 2, ySpine, nx - boxW / 2, ySpine, '#DC2626', 3.2, false);
                        ctx.fillStyle = '#DC2626'; ctx.font = 'bold 11px "Microsoft JhengHei", sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText('FS', (cx + nx) / 2, ySpine - 10);
                    }
                });

                // Draw Upper Non-Critical Nodes & Orthogonal Vertical Stubs (NO diagonal crossing!)
                stg.upper.forEach((ut, i) => {
                    const cx = slotXs[i] || (215 + i * 380);
                    drawNodeBox(ut, cx, yUpper, boxW, 84);
                    // Orthogonal vertical connector down toward spine channel
                    const yBoxBot = yUpper + 42;
                    const ySpineTop = ySpine - boxH / 2;
                    drawArrow(cx - 45, ySpineTop, cx - 45, yBoxBot, '#2563EB', 1.8, true);
                    drawArrow(cx + 45, yBoxBot, cx + 45, ySpineTop, '#2563EB', 1.8, true);
                    const pStr = (ut.predecessors || []).map(p => (taskMap[p.taskId]?.wbsCode || '')).join(',') || '起點';
                    const sStr = (succMap[ut.id] || []).map(x => x.split('(')[0]).slice(0, 2).join(',') || '竣工';
                    ctx.fillStyle = '#EFF6FF'; ctx.strokeStyle = '#93C5FD'; ctx.lineWidth = 1;
                    ctx.fillRect(cx - 135, (yBoxBot + ySpineTop) / 2 - 10, 270, 20);
                    ctx.strokeRect(cx - 135, (yBoxBot + ySpineTop) / 2 - 10, 270, 20);
                    ctx.fillStyle = '#1D4ED8'; ctx.font = 'bold 11px "Microsoft JhengHei", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(`▲ 前置:[${pStr}] ──► 後接:[${sStr}] ▼`, cx, (yBoxBot + ySpineTop) / 2);
                });

                // Draw Lower Non-Critical Nodes & Orthogonal Vertical Stubs
                stg.lower.forEach((lt, i) => {
                    const cx = slotXs[i] || (215 + i * 380);
                    drawNodeBox(lt, cx, yLower, boxW, 84);
                    const yBoxTop = yLower - 42;
                    const ySpineBot = ySpine + boxH / 2;
                    drawArrow(cx - 45, ySpineBot, cx - 45, yBoxTop, '#2563EB', 1.8, true);
                    drawArrow(cx + 45, yBoxTop, cx + 45, ySpineBot, '#2563EB', 1.8, true);
                    const pStr = (lt.predecessors || []).map(p => (taskMap[p.taskId]?.wbsCode || '')).join(',') || '起點';
                    const sStr = (succMap[lt.id] || []).map(x => x.split('(')[0]).slice(0, 2).join(',') || '竣工';
                    ctx.fillStyle = '#EFF6FF'; ctx.strokeStyle = '#93C5FD'; ctx.lineWidth = 1;
                    ctx.fillRect(cx - 135, (yBoxTop + ySpineBot) / 2 - 10, 270, 20);
                    ctx.strokeRect(cx - 135, (yBoxTop + ySpineBot) / 2 - 10, 270, 20);
                    ctx.fillStyle = '#1D4ED8'; ctx.font = 'bold 11px "Microsoft JhengHei", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(`▼ 前置:[${pStr}] ──► 後接:[${sStr}] ▲`, cx, (yBoxTop + ySpineBot) / 2);
                });
            });

            return canvas;
        }

            try {

                const totalCost = project.tasks.reduce((sum, t) => sum + (parseFloat(t.taskCost) || 0), 0);

                    cell.border = borderData;

                });

                // 主工項 (Level 1 Summary) 與子工項 (Level 2 Child) 資料列及逐日甘特圖色塊
                const fillMainRow = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E293B' } };
                const fillMainSpan = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFCBD5E1' } };
                const fillMainActive = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF334155' } };
                const fMainGold = { name: FONT_FAMILY, size: 9.5, bold: true, color: { argb: 'FFFCD34D' } };
                const fMainWhite = { name: FONT_FAMILY, size: 9, bold: true, color: { argb: 'FFFFFFFF' } };
                const fMainBar = { name: FONT_FAMILY, size: 7, bold: true, color: { argb: 'FFFCD34D' } };

                let curExcelRow = 5;
                let flatSubIdx = 0;
                const mainRowNumbers = [];

                wbsGroups.forEach((grp) => {
                    const mainRowNum = curExcelRow++;
                    mainRowNumbers.push(mainRowNum);
                    const firstSubRow = curExcelRow;
                    const lastSubRow = curExcelRow + grp.tasks.length - 1;

                    const grpCost = grp.tasks.reduce((s, t) => s + (parseFloat(t.taskCost) || 0), 0);
                    const grpWeight = totalCost > 0 ? (grpCost / totalCost) : 0;
                    const grpMinEs = grp.tasks.reduce((m, t) => (!m || (t.plannedStartDate && t.plannedStartDate < m)) ? t.plannedStartDate : m, null) || startDateStr;
                    const grpMaxEf = grp.tasks.reduce((m, t) => (!m || (t.plannedEndDate && t.plannedEndDate > m)) ? t.plannedEndDate : m, null) || endDateStr;

                    const grpMaxLf = grp.tasks.reduce((m, t) => (!m || (t.lateEndDate && t.lateEndDate > m)) ? t.lateEndDate : m, null) || grpMaxEf;
                    const grpMinEsNum = Math.min(...grp.tasks.map(t => t.es ?? 0));
                    const grpMaxEfNum = Math.max(...grp.tasks.map(t => t.ef ?? 1));
                    const grpSpanDays = Math.max(1, grpMaxEfNum - grpMinEsNum);
                    const grpCritCount = grp.tasks.filter(t => t.isCritical).length;

                    const mRow = ws01.getRow(mainRowNum);

                    for (let c = 1; c <= 12; c++) {

                    // 主工項甘特圖統括連續橫條 (Continuous Summary Bar)

                    for (let i = dailyRows.length - 1; i >= 0; i--) {
                        if (dailyRows[i].dateStr >= grpMinEs && dailyRows[i].dateStr <= grpMaxEf) { mEndIdx = i; break; }
                    }
                    if (mStartIdx !== -1 && mEndIdx >= mStartIdx) {
                        const mStartCol = 13 + mStartIdx;
                        const mEndCol = 13 + mEndIdx;
                        const mSpan = mEndCol - mStartCol + 1;
                        if (mEndCol > mStartCol) {
                            ws01.mergeCells(mainRowNum, mStartCol, mainRowNum, mEndCol);

                            bottom: { style: 'medium', color: { argb: 'FFF59E0B' } },
                            left: { style: 'medium', color: { argb: 'FFF59E0B' } },
                            right: { style: 'medium', color: { argb: 'FFF59E0B' } }

                        styleRect(ws01, mStartCol, mainRowNum, mEndCol, mainRowNum, {
                            fill: fillMainActive,

                    // 寫入該主工項底下的子工項 (Level 2 Child Rows)

                        const branchPrefix = isLastSub ? '   └─ ' : '   ├─ ';

                        const dur = parseInt(task.duration) || 1;
                        const tf = task.totalFloat ?? 0;
                        const isCrit = !!task.isCritical;
                        const statusStr = isCrit ? '[要徑] TF=0' : `浮時+${tf}天`;

                        let predsStr = '首工項 (無)';
                        if (task.predecessors && task.predecessors.length > 0) {
                            predsStr = task.predecessors.map(p => {

                        const esStr = task.plannedStartDate || '';

                        rowObj.getCell(6).value = predsStr;

                        rowObj.getCell(11).value = tf;

                        const baseFill = isCrit ? fillSoftRed : (idx % 2 === 0 ? fillWhite : fillZebra);
                        for (let c = 1; c <= 12; c++) {
                            const cell = rowObj.getCell(c);
                            cell.fill = baseFill;
                            cell.border = borderData;
                            cell.font = fData;
                            cell.alignment = (c === 2) ? alLeft : ((c === 3 || c === 4) ? alRight : alCenter);

                        rowObj.getCell(1).font = fDataBold;
                        rowObj.getCell(2).font = fDataBold;
                        rowObj.getCell(3).font = fDataBlue;
                        rowObj.getCell(12).font = isCrit ? fDataRed : fDataBlue;

                        const emptyFill = (idx % 2 === 0) ? fillWhite : fillZebra;

                        for (let dIdx = 0; dIdx < nDays; dIdx++) {
                            const col = 13 + dIdx;

                            cCell.alignment = alCenter;
                            cCell.fill = emptyFill;
                        }

                        // 連續實心工期長條 (Merged Continuous Task Bar)
                        const actStartIdx = dailyRows.findIndex(r => r.dateStr >= esStr && r.dateStr <= efStr);
                        let actEndIdx = -1;
                        for (let i = dailyRows.length - 1; i >= 0; i--) {
                            if (dailyRows[i].dateStr >= esStr && dailyRows[i].dateStr <= efStr) { actEndIdx = i; break; }
                        }
                        if (actStartIdx !== -1 && actEndIdx >= actStartIdx) {
                            const actStartCol = 13 + actStartIdx;
                            const actEndCol = 13 + actEndIdx;
                            const actSpan = actEndCol - actStartCol + 1;
                            if (actEndCol > actStartCol) {
                                ws01.mergeCells(rowNum, actStartCol, rowNum, actEndCol);
                            }
                            const barBorderClr = isCrit ? 'FF991B1B' : 'FF1E3A8A';
                            const barBorder = {
                                top: { style: 'medium', color: { argb: barBorderClr } },
                                bottom: { style: 'medium', color: { argb: barBorderClr } },
                                left: { style: 'medium', color: { argb: barBorderClr } },
                                right: { style: 'medium', color: { argb: barBorderClr } }

                            styleRect(ws01, actStartCol, rowNum, actEndCol, rowNum, {
                                fill: activeFill,
                                border: barBorder,
                                font: { name: FONT_FAMILY, size: 8, bold: true, color: { argb: 'FFFFFFFF' } },
                                alignment: { horizontal: 'center', vertical: 'middle', wrapText: false }

                            rowObj.getCell(actStartCol).value = actSpan >= 5 ? `${task.wbsCode || ''} (${dur}d)` : (actSpan >= 2 ? `${dur}d` : '1');
                        }

                        // 連續浮時緩衝長條 (Merged Continuous Float Buffer Bar)
                        if (tf > 0 && lfStr > efStr) {
                            const fltStartIdx = dailyRows.findIndex(r => r.dateStr > efStr && r.dateStr <= lfStr);
                            let fltEndIdx = -1;
                            for (let i = dailyRows.length - 1; i >= 0; i--) {
                                if (dailyRows[i].dateStr > efStr && dailyRows[i].dateStr <= lfStr) { fltEndIdx = i; break; }
                            }
                            if (fltStartIdx !== -1 && fltEndIdx >= fltStartIdx) {
                                const fltStartCol = 13 + fltStartIdx;
                                const fltEndCol = 13 + fltEndIdx;
                                const fltSpan = fltEndCol - fltStartCol + 1;
                                if (fltEndCol > fltStartCol) {
                                    ws01.mergeCells(rowNum, fltStartCol, rowNum, fltEndCol);

                                    top: { style: 'dashed', color: { argb: 'FFD97706' } },
                                    bottom: { style: 'dashed', color: { argb: 'FFD97706' } },

                                styleRect(ws01, fltStartCol, rowNum, fltEndCol, rowNum, {
                                    fill: fillGanttFloat,
                                    border: fltBorder,
                                    font: { name: FONT_FAMILY, size: 7.5, bold: true, color: { argb: 'FF92400E' } },
                                    alignment: { horizontal: 'center', vertical: 'middle', wrapText: false }
                                });
                                rowObj.getCell(fltStartCol).value = fltSpan >= 2 ? `+${tf}d` : '+';
                            }
                        }
                    });
                });

                // 合計列 (僅加總各主工項小計列，避免主工項與子工項重複加總)
                const mainCostFormula = mainRowNumbers.length > 0 ? mainRowNumbers.map(r => `C${r}`).join('+') : '0';
                const mainWeightFormula = mainRowNumbers.length > 0 ? mainRowNumbers.map(r => `D${r}`).join('+') : '0';
                const totRowObj = ws01.getRow(totalRow01);
                totRowObj.height = 24;
                totRowObj.getCell(1).value = '合計';
                totRowObj.getCell(2).value = `共 ${wbsGroups.length} 大主工項 / ${nTasks} 項子工項詳細作業（${critCount} 項要徑子工項 / ${nonCritCount} 項非要徑浮時子工項）`;
                totRowObj.getCell(3).value = { formula: mainCostFormula, result: totalCost };
                totRowObj.getCell(3).numFmt = '#,##0';
                totRowObj.getCell(4).value = { formula: mainWeightFormula, result: 1 };
                totRowObj.getCell(4).numFmt = '0.00%';
                totRowObj.getCell(5).value = nDays;
                totRowObj.getCell(6).value = '-';
                totRowObj.getCell(7).value = startDateStr;
                totRowObj.getCell(8).value = endDateStr;
                totRowObj.getCell(9).value = startDateStr;
                totRowObj.getCell(10).value = endDateStr;
                totRowObj.getCell(11).value = 0;
                totRowObj.getCell(12).value = `要徑數：${critCount}項`;

                for (let c = 1; c <= 12; c++) {
                    const cell = totRowObj.getCell(c);
                    cell.fill = fillNavy;

                const fontTotDay = { name: FONT_FAMILY, size: 7, bold: true, color: { argb: 'FFD97706' } };
                for (let dIdx = 0; dIdx < nDays; dIdx++) {

                    cTot.value = `D${dIdx + 1}`;
                    cTot.fill = fillNavy;
                    cTot.border = borderTotal;
                    cTot.font = fontTotDay;
                    cTot.alignment = alCenter;
                }

                // 底部 3 列每日 S-Curve 查核指標列 (ES / LS / Δ，採用整數格式 "0" 避免窄欄 ### 溢位)
                const rEs = totalRow01 + 1;
                const rLs = totalRow01 + 2;
                const rBw = totalRow01 + 3;
                ws01.getRow(rEs).height = 20;
                ws01.getRow(rLs).height = 20;
                ws01.getRow(rBw).height = 20;

                ws01.mergeCells(rEs, 1, rEs, 12);
                ws01.getCell(rEs, 1).value = '📈 早期排程累積完成進度上限 ES Early S-Curve (單位：%) — 每日查核目標';
                styleRect(ws01, 1, rEs, 12, rEs, { font: fDataGreen, fill: fillSoftGreen, border: borderData, alignment: alRight });

                ws01.mergeCells(rLs, 1, rLs, 12);
                ws01.getCell(rLs, 1).value = '📉 晚期容許累積進度警戒下限 LS Late S-Curve (單位：%) — 每日要徑底線';
                styleRect(ws01, 1, rLs, 12, rLs, { font: fDataRed, fill: fillSoftRed, border: borderData, alignment: alRight });

                ws01.mergeCells(rBw, 1, rBw, 12);
                ws01.getCell(rBw, 1).value = '🍌 香蕉包絡線浮時安全寬度 Δ = ES - LS (單位：%) — 每日進度調節緩衝帶';
                styleRect(ws01, 1, rBw, 12, rBw, { font: fDataAmber, fill: fillSoftAmber, border: borderData, alignment: alRight });

                const fontSEs = { name: FONT_FAMILY, size: 6.5, bold: true, color: { argb: 'FF047857' } };
                const fontSLs = { name: FONT_FAMILY, size: 6.5, bold: true, color: { argb: 'FFDC2626' } };
                const fontSBw = { name: FONT_FAMILY, size: 6.5, bold: true, color: { argb: 'FFB45309' } };

                for (let dIdx = 0; dIdx < nDays; dIdx++) {
                    const col = 13 + dIdx;
                    const dbRow = 5 + dIdx;
                    const colLet = excelColLetter(col);
                    const dRow = dailyRows[dIdx];

                    const cEs = ws01.getCell(rEs, col);
                    cEs.value = { formula: `'${dbSheetName}'!C${dbRow}`, result: Math.round(dRow.earlyVal) };
                    cEs.alignment = alCenter;
                    cEs.font = fontSEs;
                    cEs.fill = fillSoftGreen;
                    cEs.border = borderData;

                    const cLs = ws01.getCell(rLs, col);
                    cLs.value = { formula: `'${dbSheetName}'!D${dbRow}`, result: Math.round(dRow.lateVal) };
                    cLs.alignment = alCenter;
                    cLs.font = fontSLs;
                    cLs.fill = fillSoftRed;
                    cLs.border = borderData;
                    cLs.numFmt = '0';

                    const cBw = ws01.getCell(rBw, col);
                    cBw.value = { formula: `${colLet}${rEs}-${colLet}${rLs}`, result: Math.round(dRow.envVal) };
                    cBw.alignment = alCenter;
                    cBw.font = fontSBw;
                    cBw.fill = fillSoftAmber;
                    cBw.border = borderData;
                    cBw.numFmt = '0';
                }

                // =========================================================================
                // Sheet 2: 02_NOVERA_香蕉S曲線圖表看板 (月度里程碑計價查核表 + 嵌入高解析S曲線＆甘特圖)
                // =========================================================================
                const ws02 = wb.addWorksheet('02_NOVERA_香蕉S曲線圖表看板', {
                    views: [{ showGridLines: true }],
                    pageSetup: { paperSize: 8, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 1 }

                ws02.mergeCells('A1:H1');

                ];
                ws02.getRow(5).height = 26;
                mHeaders.forEach((h, i) => {
                    const cell = ws02.getCell(5, i + 1);
                    cell.value = h;
                    cell.font = fTblHdrDark;
                    cell.fill = fillSlateSub;
                    cell.alignment = alCenter;
                    cell.border = borderData;
                });

                const milestoneList = buildMilestoneRowsForProject(project, dailyRows);
                milestoneList.forEach((mItem, idx) => {
                    const r = 6 + idx;
                    const rowObj = ws02.getRow(r);
                    const estLines02 = Math.max(1, Math.ceil(String(mItem.focusNote || '').length / 32));
                    rowObj.height = Math.max(26, estLines02 * 16 + 8);
                    const pvE = Math.round(contractSum * mItem.esPct);
                    const pvL = Math.round(contractSum * mItem.lsPct);

                    rowObj.getCell(1).value = mItem.dateStr;
                    rowObj.getCell(2).value = `第 ${mItem.dayNo} 天`;
                    rowObj.getCell(3).value = mItem.esPct;

                    rowObj.getCell(4).value = { formula: `ROUND(${contractSum}*C${r}, 0)`, result: pvE };
                    rowObj.getCell(4).numFmt = '#,##0';
                    rowObj.getCell(5).value = mItem.lsPct;
                    rowObj.getCell(5).numFmt = '0.00%';
                    rowObj.getCell(6).value = { formula: `ROUND(${contractSum}*E${r}, 0)`, result: pvL };
                    rowObj.getCell(6).numFmt = '#,##0';
                    rowObj.getCell(7).value = { formula: `C${r}-E${r}`, result: mItem.esPct - mItem.lsPct };
                    rowObj.getCell(7).numFmt = '0.00%';
                    rowObj.getCell(8).value = { formula: `D${r}-F${r}`, result: pvE - pvL };
                    rowObj.getCell(8).numFmt = '#,##0';
                    rowObj.getCell(9).value = mItem.focusNote;

                    const zFill = (idx % 2 === 0) ? fillWhite : fillZebra;
                    styleRect(ws02, 1, r, 9, r, { font: fData, fill: zFill, border: borderData, alignment: alRight });
                    rowObj.getCell(1).alignment = alCenter;
                    rowObj.getCell(2).alignment = alCenter;
                    rowObj.getCell(9).alignment = alLeft;
                    rowObj.getCell(1).font = fDataBold;
                    rowObj.getCell(3).font = fDataGreen;
                    rowObj.getCell(4).font = fDataGreen;
                    rowObj.getCell(5).font = fDataRed;
                    rowObj.getCell(6).font = fDataRed;
                    rowObj.getCell(7).font = fDataAmber;

                    ws05.getRow(curR05).height = 24;
                    curR05++;

                    // 上方並聯支線泳道
                    if (hasUp) {
                        const rUp = curR05;
                        ws05.getRow(rUp).height = 17;
                        ws05.getRow(rUp + 1).height = 34;
                        ws05.getRow(rUp + 2).height = 17;
                        ws05.mergeCells(rUp, 1, rUp + 2, 1);
                        const lblU = ws05.getCell(rUp, 1);
                        lblU.value = '【並聯支線 A】\n上方同步作業\n(藍框 TF>0)';
                        lblU.font = fDataBlue;
                        lblU.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEFF6FF' } };
                        lblU.alignment = alCenter;

                        stg.upper.forEach((ut, idxU) => {
                            drawNativeAonBox(rUp, 2 + idxU * 4, ut);
                        });
                        curR05 += 3;

                        // 上方正交連接通道列
                        const rUConn = curR05;
                        ws05.getRow(rUConn).height = 28;
                        const cLbl = ws05.getCell(rUConn, 1);
                        cLbl.value = '▲ 正交邏輯通道';
                        cLbl.font = fDataBlue;
                        cLbl.alignment = alCenter;

                        stg.upper.forEach((ut, idxU) => {
                            const cLeft = 2 + idxU * 4;
                            ws05.mergeCells(rUConn, cLeft, rUConn, cLeft + 2);
                            const pTxt = (ut.predecessors || []).map(p => `${taskMap[p.taskId]?.wbsCode || ''}(${p.type || 'FS'}${parseInt(p.lag) ? '+' + p.lag + 'd' : ''})`).join(', ') || '起點';
                            const sTxt = (succStrMap[ut.id] || []).slice(0, 2).join(', ') || '竣工';
                            const cc = ws05.getCell(rUConn, cLeft);
                            cc.value = `▲ 前置:${pTxt} ──► 後接:${sTxt} ▼`;
                            cc.font = { name: FONT_FAMILY, size: 8, bold: true, color: { argb: 'FF1D4ED8' } };
                            cc.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF0F9FF' } };
                            cc.alignment = alCenter;
                        });
                        curR05++;
                    }

                    // 中央紅色要徑主幹泳道
                    const rSp = curR05;
                    ws05.getRow(rSp).height = 18;
                    ws05.getRow(rSp + 1).height = 36;
                    ws05.getRow(rSp + 2).height = 18;
                    ws05.mergeCells(rSp, 1, rSp + 2, 1);
                    const lblC = ws05.getCell(rSp, 1);
                    lblC.value = '★【要徑主幹】\n核心連續工序\n(紅框 TF=0)';
                    lblC.font = fDataRed;
                    lblC.fill = fillSoftRed;
                    lblC.alignment = alCenter;

                    stg.crit.forEach((ct, slotI) => {
                        const cLeft = 2 + slotI * 4;
                        drawNativeAonBox(rSp, cLeft, ct);
                        if (slotI < stg.crit.length - 1) {
                            const ac = ws05.getCell(rSp + 1, cLeft + 3);
                            ac.value = '───►\n(FS)';
                            ac.font = { name: FONT_FAMILY, size: 9, bold: true, color: { argb: 'FFDC2626' } };
                            ac.alignment = alCenter;
                        }
                    });
                    curR05 += 3;

                    // 下方正交連接通道列 ＋ 下方並聯支線泳道
                    if (hasLow) {
                        const rLConn = curR05;
                        ws05.getRow(rLConn).height = 28;
                        const cLbl = ws05.getCell(rLConn, 1);
                        cLbl.value = '▼ 正交邏輯通道';
                        cLbl.font = fDataBlue;
                        cLbl.alignment = alCenter;

                        stg.lower.forEach((lt, idxL) => {
                            const cLeft = 2 + idxL * 4;
                            ws05.mergeCells(rLConn, cLeft, rLConn, cLeft + 2);
                            const pTxt = (lt.predecessors || []).map(p => `${taskMap[p.taskId]?.wbsCode || ''}(${p.type || 'FS'}${parseInt(p.lag) ? '+' + p.lag + 'd' : ''})`).join(', ') || '起點';
                            const sTxt = (succStrMap[lt.id] || []).slice(0, 2).join(', ') || '竣工';
                            const cc = ws05.getCell(rLConn, cLeft);
                            cc.value = `▼ 前置:${pTxt} ──► 後接:${sTxt} ▲`;
                            cc.font = { name: FONT_FAMILY, size: 8, bold: true, color: { argb: 'FF1D4ED8' } };
                            cc.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF0F9FF' } };
                            cc.alignment = alCenter;
                        });
                        curR05++;

                        const rLow = curR05;
                        ws05.getRow(rLow).height = 17;
                        ws05.getRow(rLow + 1).height = 34;
                        ws05.getRow(rLow + 2).height = 17;
                        ws05.mergeCells(rLow, 1, rLow + 2, 1);
                        const lblL = ws05.getCell(rLow, 1);
                        lblL.value = '【並聯支線 B】\n下方同步作業\n(藍框 TF>0)';
                        lblL.font = fDataBlue;
                        lblL.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEFF6FF' } };
                        lblL.alignment = alCenter;

                        stg.lower.forEach((lt, idxL) => {
                            drawNativeAonBox(rLow, 2 + idxL * 4, lt);
                        });
                        curR05 += 3;
                    }

                    // 跨階段要徑銜接導引列
                    if (sIdx < pdmStages.length - 1) {
                        const rTrans = curR05;
                        ws05.getRow(rTrans).height = 22;
                        ws05.mergeCells(rTrans, 1, rTrans, 24);
                        const cNext = pdmStages[sIdx + 1].crit[0];
                        const trCell = ws05.getCell(rTrans, 1);
                        trCell.value = `┏━━━ ▼ 要徑主幹跨階段無縫推進：由 [${cLast.wbsCode}] (D${cLast.ef} 完成) ═══► 緊接下一階段要徑 [${cNext.wbsCode}] (D${(cNext.es ?? 0) + 1} 開始，FS 零空窗) ▼ ━━━┓`;
                        trCell.font = fDataRed;
                        trCell.fill = fillSoftRed;
                        trCell.alignment = alCenter;
                        curR05++;
                    }
                });


                // 產出二進位 Buffer 並觸發瀏覽器下載
                const buffer = await wb.xlsx.writeBuffer();
                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const safeProjName = (project.name || '工程專案').replace(/[\s\/\\:*?"<>|]+/g, '_');
                a.download = `NOVERA_${safeProjName}_CPM要徑視覺甘特圖與S曲線總表_旗艦專業版_${today}.xlsx`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 5000);

                showMessage('【NOVERA 旗艦專業版 Excel 總表】(含逐日視覺甘特圖、香蕉S曲線看板與每日數據庫) 已成功匯出！', 'success');

            } catch (err) {
                console.error("Excel export failed: ", err);
                showMessage('匯出 Excel 報告失敗：' + err.message, 'danger');
            }
        }

        function showMessage(text, type = 'success') {
            const box = document.getElementById('message-box');
            const alertDiv = document.createElement('div');
            const borderTone = type === 'danger' ? 'border-[#B84A39]' : 'border-[#191918]';
            alertDiv.className = `px-4 py-3 mb-2 bg-[#191918] text-white border ${borderTone} transition-all duration-200 transform translate-x-full opacity-0 text-xs font-normal tracking-wide`;
            alertDiv.textContent = text;
            box.appendChild(alertDiv);

            setTimeout(() => {
                alertDiv.classList.remove('translate-x-full', 'opacity-0');
                alertDiv.classList.add('translate-x-0', 'opacity-100');
            }, 10);

            setTimeout(() => {
                alertDiv.classList.add('opacity-0');
                setTimeout(() => {
                    if (alertDiv.parentNode) alertDiv.remove();
                }, 250);
            }, 2600);
        }

        let confirmCallback = null;
        function showConfirmModal(message, onConfirm) {
            document.getElementById('confirm-modal-message').textContent = message;
            confirmCallback = onConfirm;
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function hideConfirmModal() {
            document.getElementById('confirm-modal').classList.add('hidden');
            confirmCallback = null;
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();

            const eventHandler = (event) => {
                const button = event.target.closest('button[data-action]');
                const header = event.target.closest('div[data-action="toggle-collapse"]');
                try {
                    if (button) {
                        event.stopPropagation();
                        const { action, projectId, taskId, canvasId } = button.dataset;
                        switch (action) {
                            case 'edit-project': showEditModal(projectId); break;
                            case 'delete-project': deleteProject(projectId); break;
                            case 'move-task-up': moveTask(projectId, taskId, 'up'); break;
                            case 'move-task-down': moveTask(projectId, taskId, 'down'); break;
                            case 'insert-task-after': insertTaskAfter(projectId, taskId); break;
                            case 'edit-task': showEditTaskModal(projectId, taskId); break;
                            case 'delete-task': deleteTask(projectId, taskId); break;
                            case 'show-chart-modal': showChartModal(projectId); break;
                            case 'export-flagship-excel': exportProjectToExcel(button); break;
                            case 'download-single-chart': downloadSingleChartAsPNG(canvasId, projectId); break;
                        }
                    } else if (header) {
                        const { projectId } = header.dataset;
                        toggleCollapse(projectId);
                    }
                } catch (e) {
                    console.error("操作失敗:", e);
                    showMessage("操作發生錯誤，請檢查主控台紀錄。", "danger");
                }
            };

            document.getElementById('project-list-container').addEventListener('click', eventHandler);
            document.getElementById('chart-modal').addEventListener('click', eventHandler);

            document.getElementById('confirm-modal-confirm').addEventListener('click', () => {
                if (typeof confirmCallback === 'function') confirmCallback();
                hideConfirmModal();
            });
            document.getElementById('confirm-modal-cancel').addEventListener('click', hideConfirmModal);

            document.getElementById('management-center').classList.remove('hidden');
            document.getElementById('project-creation-form').classList.add('hidden');
            renderProjects();

            // 動態更新 Footer 版權年份
            const footerYear = document.getElementById('footer-year');
            if (footerYear) footerYear.textContent = new Date().getFullYear();
        });
    </script>

</body>
</html>
